[package]
name = "todd-transcode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "T-Odd Transcode: GStreamer output pipelines with hardware-acceleration matrix and multichannel audio buses"

[dependencies]
todd-common = { path = "../todd-common" }

anyhow = { workspace = true }
bytes = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# GStreamer output forwarding. Requires libgstreamer1.0-dev >= 1.24 on the
# build host (Ubuntu 24.04 ships 1.24). Disabled by default so the
# workspace builds anywhere.
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }

[features]
default = []
gst = ["dep:gstreamer", "dep:gstreamer-app"]
