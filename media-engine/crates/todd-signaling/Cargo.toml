[package]
name = "todd-signaling"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "T-Odd Signaling: Axum control plane for rooms, auth and media routing (binary: todd-studio)"

[[bin]]
name = "todd-studio"
path = "src/main.rs"

[dependencies]
todd-common = { path = "../todd-common" }
todd-replay = { path = "../todd-replay" }
todd-sfu = { path = "../todd-sfu" }
todd-telemetry = { path = "../todd-telemetry" }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
chrono = { workspace = true }
dashmap = { workspace = true }
dotenvy = { workspace = true }
futures-util = "0.3"
redis = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[features]
default = []
gst = ["todd-sfu/gst"]
