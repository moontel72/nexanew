# ============================================================================
# T-Odd Media Engine — docker-compose (Phase 2 dedicated media server)
#
# Phase 1 note: on the shared VPS you can run the bare-metal systemd units
# instead — the images are identical, so nothing changes when you move.
#
#   docker compose up -d                     # studio + broadcaster + redis
#   docker compose --profile turn up -d      # + coturn TURN server
#
# ============================================================================

name: todd-media-engine

services:
  # ---- control plane -------------------------------------------------------
  studio:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PACKAGE: todd-signaling
        BIN: todd-studio
    image: traceodd/todd-studio:latest
    restart: unless-stopped
    # Phase 1: keep loopback-only; nginx on the host reaches it.
    # Phase 2: publish 8080 publicly if nginx runs in another host/VM.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../../.env
    environment:
      STUDIO_HOST: 0.0.0.0          # inside the container network
      MEDIA_PLANE: remote           # broadcaster runs as its own service
      BROADCASTER_URL: http://broadcaster:8081
      ROOM_STORE: redis             # shared state across Studio replicas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - broadcaster
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- media plane ----------------------------------------------------------
  broadcaster:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PACKAGE: todd-sfu
        BIN: todd-broadcaster
    image: traceodd/todd-broadcaster:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - ../../.env
    environment:
      BROADCASTER_HOST: 0.0.0.0    # inside the container network
      # In Phase 2 the media server needs its PUBLIC IP reachable for ICE
      # candidate selection; a plain TURN server (below) covers carrier NATs.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---- room-state store -----------------------------------------------------
  # Studio runs with `ROOM_STORE=redis`, so this holds real room/program
  # state. Persistence is therefore on: with `--save "" --appendonly no`
  # every `docker compose restart`, image upgrade or host reboot wiped every
  # room and forced the operator to re-create matches.
  #
  # RDB snapshots are the cheap, low-write option (a snapshot every 60s if
  # >=100 keys changed, and on shutdown); the volume keeps them across
  # container replacement. Enable AOF too (`--appendonly yes`) if losing up to
  # one snapshot window is unacceptable.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--save",
        "60",
        "100",
        "--save",
        "300",
        "10",
        "--dir",
        "/data",
      ]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---- TURN server for carrier-NAT traversal ---------------------------------
  # coturn needs host networking on Linux to expose the full UDP relay
  # range (49160-49200) — hence the profile so it is opt-in.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    profiles: ["turn"]

# Named so the Redis snapshots survive `docker compose down` + `up` and image
# upgrades — the whole point of enabling persistence above.
volumes:
  redis-data:
