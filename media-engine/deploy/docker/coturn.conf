# coturn TURN server config for the T-Odd media engine.
#
# Why TURN: mobile cameras on carrier networks are frequently behind
# symmetric NAT, where direct peer-to-peer ICE fails. TURN relays SRTP
# over UDP so the stream still arrives. Phase 1 can live without it if all
# cameras are on good networks; Phase 2 (dedicated media server) should
# enable it from day one.
#
# Firewall: open 3478/tcp+udp, 5349/tcp (TLS) and 49160-49200/udp.
#
# Production note: replace the static user with coturn's REST API
# (use-auth-secret + static-auth-secret) and mint short-lived TURN
# credentials inside Studio when room tokens are issued.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=traceodd.com

# Static credentials — MUST match TURN_SERVERS in .env:
#   TURN_SERVERS=turnuser:turnpass@media.traceodd.com:3478
user=turnuser:turnpass

min-port=49160
max-port=49200

no-cli
no-multicast-peers
