# T-Odd TURN relay (coturn) configuration.
#
# Media relay for publishers/viewers whose networks block direct UDP:
# the engine allocates relay candidates through this server and RTP
# reaches clients that could never complete direct ICE.
#
# Deployed by the media-engine-deploy workflow to /etc/turnserver.conf
# and run by deploy/systemd/todd-turn.service.

listening-port=3478

# Credentials shared with the media engine (TURN_SERVERS env) and the
# Todd Broadcaster app's optional TURN fields.
fingerprint
lt-cred-mech
realm=traceodd.com
user=traceodd:traceodd-turn-2026

# Public address advertised in relay candidates. Keep in sync with the
# VPS public IP (Hetzner: 135.181.46.27).
relay-ip=135.181.46.27
external-ip=135.181.46.27

# Relay port range. Widened from 41 ports (49160-49200): that pool
# exhausted under concurrent sessions and produced `bind: Address already
# in use` / failed allocations. This is the IANA ephemeral range; the VPS
# has no host firewall (ufw inactive) and UDP outside the old range was
# verified reachable from the public internet.
min-port=49152
max-port=65535

verbose
no-cli
no-tlsv1
no-tlsv1_1
