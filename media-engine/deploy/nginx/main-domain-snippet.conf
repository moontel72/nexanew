# ============================================================================
# Path-based coexistence on the MAIN domain (cricket.traceodd.com)
#
# Paste this INSIDE the existing server {} block of your Laravel vhost
# (traceodd.conf / cricket-public.conf), BEFORE any `location ~ \.php$`
# regex block so the ^~ prefix match wins.
#
# Laravel keeps owning /api/v1/*; only /api/v1/media/* is proxied to the
# Rust engine (the /media prefix is stripped before proxying). Do NOT
# define Laravel routes under /api/v1/media/* — nginx owns that namespace.
#
# Reload: nginx -t && systemctl reload nginx
# ============================================================================

location ^~ /api/v1/media/ {
    rewrite ^/api/v1/media/(.*)$ /api/v1/$1 break;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 1m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
