# ============================================================================
# T-Odd Media Engine — subdomain reverse proxy (media.traceodd.com)
#
# Proxies *signaling only* (HTTP: SDP offers/answers, REST API).
# WebRTC media (SRTP/UDP) flows peer-to-peer or via coturn (3478/5349 +
# UDP relay range) and NEVER traverses nginx. This is what keeps Laravel's
# PHP-FPM and the media plane from contending for bandwidth on a shared
# box: nginx carries kilobytes of SDP, not gigabytes of video.
#
# Install:
#   cp deploy/nginx/media-engine.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/media-engine.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ============================================================================

upstream todd_studio {
    # Phase 1: Studio binds 127.0.0.1:8080 on the same VPS as Laravel.
    # Phase 2: point this at the dedicated media server's LAN/VPN IP.
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name media.traceodd.com;

    # LetsEncrypt ACME challenges must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.traceodd.com;

    ssl_certificate     /etc/letsencrypt/live/media.traceodd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.traceodd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ---- REST API + WHIP signaling ----
    location /api/v1/ {
        proxy_pass http://todd_studio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Latency, not throughput, is the goal: SDP bodies are a few KB.
        # Buffering off keeps WHIP negotiation snappy; timeouts are
        # generous because WHIP sessions stay open across the whole
        # broadcast (clients only call DELETE at the end).
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 1m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- health checks (no auth) ----
    location = /healthz { proxy_pass http://todd_studio; }
    location = /readyz  { proxy_pass http://todd_studio; }

    location / {
        return 404;
    }
}
