name: nexatrace_system
description: NexaTrace - Cloud-Based SaaS Platform for Product Tracking, Authentication, and Supply Chain Management
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Navigation
  go_router: ^17.1.0

  # UI & Styling
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0
  gap: ^3.0.1
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  lottie: ^3.3.2

  # Forms & Validation
  formz: ^0.8.0
  flutter_form_builder: ^10.3.0+2

  # Networking
  dio: ^5.4.0
  http: ^1.2.2
  logger: ^2.0.2
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0

  # Authentication & Security
  flutter_secure_storage: ^10.0.0
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3

  # QR Code & Barcode
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  barcode: ^2.2.0
  barcode_widget: ^2.0.0

  # Internationalization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # File Operations
  file_picker: ^10.3.10
  open_file: ^3.3.3
  path: ^1.8.3
  pdf: ^3.10.4
  printing: ^5.11.1

  # Rust Integration
  flutter_rust_bridge: ^2.11.1
  ffi: ^2.1.0

  # Utilities
  uuid: ^4.3.0
  url_launcher: ^6.2.1
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8

  # Codegen tools (compatible set)
  retrofit_generator: ^10.2.1
  json_serializable: ^6.7.1
  freezed: ^3.2.3
  mockito: ^5.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/translations/

  generate: true
