name: trace_odd
description: Trace Odd - Cloud-Based SaaS Platform for Product Tracking, Authentication, and Supply Chain Management
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  get_it: ^7.6.0

  # Navigation
  go_router: ^17.1.0

  # UI & Styling
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0
  gap: ^3.0.1
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  lottie: ^3.3.2
  flutter_svg: ^2.0.10+1

  # Forms & Validation
  formz: ^0.8.0
  flutter_form_builder: ^10.3.0+2

  # Networking & Performance Data Parsing
  dio: ^5.4.0
  http: ^1.2.2
  web_socket_channel: ^3.0.2
  retrofit: ^4.1.0
  wakelock_plus: ^1.2.8
  logger: ^2.0.2
  pretty_dio_logger: ^1.3.1

  # Local Storage & Encryption
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0

  # Authentication & Security
  flutter_secure_storage: ^10.0.0
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3

  # QR Code & Barcode
  # NOTE: qr_code_scanner removed — its Android plugin has no namespace
  # and breaks AGP 8+ builds; mobile_scanner covers every scan flow.
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  barcode: ^2.2.0
  barcode_widget: ^2.0.0

  # Internationalization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # File Operations
  file_picker: ^10.3.10
  open_file: ^3.3.3
  path: ^1.8.3
  pdf: ^3.10.4
  printing: ^5.11.1

  # Rust Integration
  flutter_rust_bridge: ^2.11.1
  ffi: ^2.1.0

  # Todd Broadcaster (mobile ground camera app)
  flutter_webrtc: ^0.12.9
  battery_plus: ^6.1.0
  web: ^1.1.1

  # Utilities
  uuid: ^4.3.0
  url_launcher: ^6.2.1
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  syncfusion_flutter_charts: ^33.1.47
  fl_chart: ^0.66.0
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8

  # Codegen tools (compatible set)
  retrofit_generator: ^10.2.1
  freezed: ^3.1.0
  json_serializable: ^6.7.1
  mockito: ^5.3.2

  # Branding
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/trace_odd_logo_1024.png"
  adaptive_icon_background: "#0A0E21"
  adaptive_icon_foreground: "assets/images/logos/trace_odd_adaptive_fg.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logos/trace_odd_logo_1024.png"
    background_color: "#0A0E21"
    theme_color: "#896512"
  windows:
    generate: true
    image_path: "assets/images/logos/trace_odd_logo_1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/logos/trace_odd_logo_1024.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/translations/
    - assets/logo/
    - assets/landing/

  generate: true
