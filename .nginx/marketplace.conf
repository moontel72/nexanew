# =============================================================================
# NEXATRACE MARKETPLACE — PUBLIC STOREFRONT SERVER BLOCK
# =============================================================================
# Server: 135.181.46.27
# Path:   /etc/nginx/sites-available/marketplace
# Host:   market.traceodd.com  (Flutter build: lib/main_marketplace.dart)
#
# READ-ONLY, NO LOGIN (MASTER-TASK-LIST item #12).
#
# HARD API ISOLATION (same posture as cricket-public.conf):
#   Only the two PUBLIC read endpoints the storefront needs are proxied —
#     /api/v1/reseller/products   (published products)
#     /api/v1/reseller/factories  (verified factories)
#     /api/v1/public/content/*    (Super-Admin-edited site content)
#   Everything else under /api/ returns 403, so a visitor — or a stolen token —
#   cannot reach an authenticated panel endpoint from this host.
# =============================================================================

server {
    listen 80;
    server_name market.traceodd.com;

    root /var/www/traceodd/marketplace-web/;
    index index.html;

    # ─────────────────────────────────────────────────────────────────────────
    # 1. THE STOREFRONT (Flutter Web build — main_marketplace.dart)
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";

        # Flutter web emits the same main.dart.js filename for every build —
        # aggressive immutable caching would serve stale bundles for weeks.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 2. PUBLIC READ APIs — the only two the storefront is allowed to reach
    # ─────────────────────────────────────────────────────────────────────────
    location ^~ /api/v1/reseller/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/v1/public/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        include fastcgi_params;
    }

    # Everything else under /api/ is blocked on this host.
    location ^~ /api/ {
        return 403;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 3. UPLOADED FILES (product images, factory logos)
    # ─────────────────────────────────────────────────────────────────────────
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
        add_header Access-Control-Allow-Origin *;
    }
}
