# =============================================================================
# NEXATRACE CRICKET — MANAGER / ADMIN SERVER BLOCK (DUAL-PANEL SYSTEM)
# =============================================================================
# Server: 135.181.46.27
# Path:   /etc/nginx/sites-available/cricket-manager
#
# ARCHITECTURE (Dual-subdomain isolation):
#   manager.cricket.traceodd.com → THIS FILE — manager & admin operations
#   cricket.traceodd.com         → cricket-public.conf — public fan portal
#
# HARD API ISOLATION:
#   Only /api/v1/cricket/manager/* and /api/v1/cricket/admin/* are proxied.
#   Public viewer endpoints and all non-cricket APIs return 403 — the
#   manager panel only talks to management routes.
# =============================================================================

server {
    listen 80;
    server_name manager.cricket.traceodd.com;

    # =========================================================================
    # 1. CRICKET MANAGER PANEL (Flutter Web — main_cricket_manager.dart)
    # =========================================================================
    root /var/www/traceodd/cricket-manager-web/;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # 2. MANAGER API — cricket/manager/* + cricket/admin/* ONLY
    # =========================================================================
    location ^~ /api/v1/cricket/manager/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    location ^~ /api/v1/cricket/admin/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # Laravel API health check
    location = /health {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        include fastcgi_params;
    }

    # Everything else under /api/ (public viewer + other verticals) blocked.
    location ^~ /api/ {
        return 403;
    }

    # =========================================================================
    # 3. UPLOADED FILES (Team Logos, Banners, Media Management)
    # =========================================================================
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
        add_header Access-Control-Allow-Origin *;
    }

    # =========================================================================
    # 4. LARAVEL REVERB — WebSocket Proxy (score streams inside dashboard)
    # =========================================================================
    location /app/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    location /apps/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }
}
