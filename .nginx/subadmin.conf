# =============================================================================
# NEXATRACE SUB-ADMIN — DEDICATED HOST SERVER BLOCK
# =============================================================================
# Server: 135.181.46.27
# Path:   /etc/nginx/sites-available/subadmin
# Host:   subadmin.traceodd.com
#
# WHY THIS EXISTS
#   The Sub-Admin panel was only reachable as a sub-path of the admin host
#   (`http://135.181.46.27/sub-admin/login`). The owner registered
#   `subadmin.traceodd.com`, so this block serves that host and sends the root
#   straight to the Sub-Admin login.
#
# WHY THE API IS PROXIED WHOLE (not prefix-restricted like cricket/marketplace)
#   All panels are ONE Flutter bundle (MASTER-TASK-LIST.md
#   Blocker B), and the Sub-Admin panel legitimately calls several groups:
#     /api/v1/sub-admin/auth/   its own login (GlobalAuthController)
#     /api/v1/admin/            admin/* — reseller-accounts, factory-companies,
#                               marketplace oversight, absolute-layouts, sub-admins
#     /api/v1/auth/             unified login / session (shared)
#     /api/v1/user/  /api/v1/sync/  /api/v1/files/   shared platform prefixes
#     /api/v1/marketplace/      catalog/consumer helpers
#     /api/v1/reseller/         the public browse the oversight preview reads
#     /api/v1/cricket/          cricket-manager CRUD on the cricket dashboard
#   Prefix-restricting this host would break the panel. The real isolation for
#   these panels is MASTER-TASK-LIST.md Phase 1 (Blocker B), not nginx.
# =============================================================================

server {
    listen 80;
    server_name subadmin.traceodd.com;
    client_max_body_size 10m;

    # The root is the panel's entry point, not the Super Admin login.
    location = / {
        return 302 /sub-admin/login;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 1. THE PANEL (same Flutter bundle as the admin host — frontend/)
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        root /var/www/traceodd/frontend/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";

        # Flutter web reuses the same main.dart.js filename every build —
        # without this a browser can serve a stale bundle for weeks.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 2. BACKEND API — Laravel via PHP-FPM
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 3. UPLOADED FILES
    # ─────────────────────────────────────────────────────────────────────────
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
        add_header Access-Control-Allow-Origin *;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 4. LARAVEL REVERB — WebSocket proxy (live telemetry for cricket views)
    # ─────────────────────────────────────────────────────────────────────────
    location /app/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    location /apps/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }
}
