# =============================================================================
# NEXATRACE CRICKET — SRS MEDIA SERVER CONFIGURATION
# =============================================================================
# Path: /usr/local/srs/conf/cricket.conf
# Service: cricket-srs.service
#
# SRS (Simple Realtime Server) handles:
#   - RTMP ingest from OBS / mobile encoders (up to 5 cameras)
#   - HLS segmentation and playlist generation
#   - Adaptive Bitrate Streaming (ABR) via FFmpeg transcoding
#     (720p, 480p, 360p renditions)
#
# This is a COMPLETELY SEPARATE process from the main web server.
# =============================================================================

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        file;
srs_log_file        /var/log/srs-cricket.log;

# ─── HTTP API Server (for stream status queries) ─────────
http_api {
    enabled         on;
    listen          1985;
    cross_domain    on;
}

# ─── HTTP Server (for HLS delivery to CDN) ───────────────
http_server {
    enabled         on;
    listen          8088;
    dir             /var/www/traceodd/cricket-hls/;
    cross_domain    on;
}

# ─── RTMP Server ─────────────────────────────────────────
rtc_server {
    enabled         off;  # WebRTC not needed — using HLS
}

# ─── VHOST: Default ingest application ───────────────────
vhost __defaultVhost__ {
    # --- HLS Output Configuration ---
    hls {
        enabled         on;
        hls_fragment    3;      # 3-second segments
        hls_td_ratio    1.5;
        hls_window      30;     # Keep 30 seconds of segments
        hls_path        /var/www/traceodd/cricket-hls;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;

        # --- ABR: Multiple quality renditions via FFmpeg ---
        hls_acodec      aac;
        hls_vcodec      libx264;

        # Master playlist (referencing all renditions)
        hls_ctx         master;
        hls_m3u8_file   [app]/[stream]-master.m3u8;
    }

    # --- Transcode Engine for ABR ---
    transcode {
        enabled     on;

        # Rendition 1: 720p HD (1280x720 @ 2.5 Mbps) — WiFi/4G strong
        engine hd {
            enabled         on;
            vcodec          libx264;
            vbitrate        2500;
            vfps            30;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         ultrafast;  # Minimal CPU usage
            vparams         { keyint=60; min-keyint=30; scenecut=0; }
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/[app]?vhost=__defaultVhost__/[stream]-hd;
        }

        # Rendition 2: 480p SD (854x480 @ 1.2 Mbps) — 4G/3G strong
        engine sd {
            enabled         on;
            vcodec          libx264;
            vbitrate        1200;
            vfps            25;
            vwidth          854;
            vheight         480;
            vthreads        1;
            vprofile        main;
            vpreset         ultrafast;
            vparams         { keyint=50; min-keyint=25; scenecut=0; }
            acodec          aac;
            abitrate        96;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/[app]?vhost=__defaultVhost__/[stream]-sd;
        }

        # Rendition 3: 360p Low (640x360 @ 600 Kbps) — 3G weak / 2G edge
        engine low {
            enabled         on;
            vcodec          libx264;
            vbitrate        600;
            vfps            20;
            vwidth          640;
            vheight         360;
            vthreads        1;
            vprofile        baseline;
            vpreset         ultrafast;
            vparams         { keyint=40; min-keyint=20; scenecut=0; }
            acodec          aac;
            abitrate        64;
            asample_rate    44100;
            achannels       1;
            output          rtmp://127.0.0.1:[port]/[app]?vhost=__defaultVhost__/[stream]-sd;
        }
    }

    # --- Publish security (simple stream key validation) ---
    publish {
        mr      3500;  # 30-second publish timeout
    }
}

# =============================================================================
# NOTES:
#   1. Stream keys are generated per-camera by the Cricket Manager panel
#      and stored in cricket_streams.rtmp_stream_key.
#   2. OBS encoder pushes to: rtmp://cricket.traceodd.com:1935/live/{stream_key}
#   3. HLS playlist available at: https://cricket.traceodd.com/hls/live/{stream_key}.m3u8
#   4. For CDN: Configure BunnyCDN Pull Zone to pull from origin:
#      https://cricket.traceodd.com/hls/
# =============================================================================
