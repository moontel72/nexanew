# NexaTrace Documentation — operator manuals (docs.traceodd.com)
#
# - `/` : compiled Docusaurus static site (deployed to /var/www/docs)
#
# TLS: Cloudflare terminates HTTPS at the edge for this zone, so the origin
# stays HTTP (listen 80). For direct-to-origin HTTPS, uncomment the
# `listen 443 ssl` block and run `certbot --nginx -d docs.traceodd.com`.

server {
    listen 80;
    server_name docs.traceodd.com;

    root /var/www/docs;
    index index.html;

    # Direct-to-origin HTTPS (only when NOT using Cloudflare proxy).
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/docs.traceodd.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/docs.traceodd.com/privkey.pem;

    # Unhashed brand assets are replaced on every rebrand — never cache them
    # (the generic static-asset rule below would otherwise pin them for 30d).
    location = /img/logo.svg {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /img/favicon.png {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # =========================================================================
    # PUBLIC DYNAMIC CONTENT API — docs pages fetch Super Admin-edited blocks
    # (text + screenshots) at runtime, proxied same-origin to Laravel.
    # =========================================================================
    location /api/v1/public/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
        add_header Cache-Control "no-cache";
    }

    # Screenshots uploaded via the Super Admin panel (shared Laravel storage).
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
    }

    # Long-lived cache for hashed static assets (Docusaurus fingerprints
    # every JS/CSS bundle, so immutable caching is safe).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app fallback for the docs router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
