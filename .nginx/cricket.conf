# =============================================================================
# NEXATRACE CRICKET MODULE — NGINX SERVER BLOCK
# =============================================================================
# Server: 135.181.46.27
# Path:   /etc/nginx/sites-available/cricket
#
# ARCHITECTURE:
#   - Dedicated subdomain: cricket.traceodd.com
#   - API routes proxied to existing Laravel PHP-FPM instance (port reuse)
#   - WebSocket proxy to Laravel Reverb (port 8080)
#   - HLS segments served from /var/www/traceodd/cricket-hls/
#   - Static dormant page served when tournament is not active
#   - ZERO impact on main traceodd.conf
# =============================================================================

server {
    listen 80;
    server_name cricket.traceodd.com;

    # =========================================================================
    # 1. MAIN CRICKET PORTAL (Flutter Web Build)
    #    Serves the public-facing cricket tournament portal.
    # =========================================================================
    location / {
        root /var/www/traceodd/cricket-web/;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # 2. HLS STREAMING SEGMENTS (SRS Output)
    #    SRS writes .ts segments and .m3u8 playlists here.
    #    CDN (BunnyCDN/Cloudflare) pulls from this origin.
    # =========================================================================
    location /hls/ {
        alias /var/www/traceodd/cricket-hls/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # =========================================================================
    # 3. BACKEND API — Laravel via PHP-FPM
    #    Same PHP-FPM pool as main admin panel.
    #    Cricket routes are isolated at api/v1/cricket/*.
    # =========================================================================
    location /api/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # =========================================================================
    # 4. UPLOADED FILES (Team Logos, Banners, etc.)
    # =========================================================================
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
        add_header Access-Control-Allow-Origin *;
    }

    # =========================================================================
    # 5. LARAVEL REVERB — WebSocket Proxy
    #    All live score updates flow through Reverb on port 8080.
    #    Flutter clients connect via wss://cricket.traceodd.com/app/...
    # =========================================================================
    location /app/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    location /apps/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }
}
