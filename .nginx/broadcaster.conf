# =============================================================================
# NEXATRACE — TODD BROADCASTER WEB APP (broadcaster.traceodd.com)
# =============================================================================
# Server: 135.181.46.27
# Path:   /etc/nginx/sites-available/broadcaster
#
# Mobile ground-camera web app (main_broadcaster.dart) — a cameraman opens
# this PWA on a phone, pastes the WHIP ingest URL from Todd Studio's Input
# Panel, and the phone becomes a live camera source.
#
# TLS: Cloudflare terminates HTTPS at the edge (orange cloud).
# =============================================================================

server {
    listen 80;
    server_name broadcaster.traceodd.com;

    root /var/www/traceodd/broadcaster-web/;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";

        # Flutter web emits the same main.dart.js filename for every build —
        # aggressive immutable caching would serve STALE bundles for weeks.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }
    }
}
