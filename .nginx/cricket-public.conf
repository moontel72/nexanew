# =============================================================================
# NEXATRACE CRICKET — PUBLIC VIEWER SERVER BLOCK (DUAL-PANEL SYSTEM)
# =============================================================================
# Server: 135.181.46.27
# Path:   /etc/nginx/sites-available/cricket-public
#
# ARCHITECTURE (Dual-subdomain isolation):
#   cricket.traceodd.com        → THIS FILE — public fan portal only
#   manager.cricket.traceodd.com → cricket-manager.conf — manager/admin panel
#
# HARD API ISOLATION:
#   Only /api/v1/cricket/public/* is proxied to Laravel. All manager/admin
#   API routes and non-cricket API routes return 403 — the public portal
#   cannot reach management endpoints even with a stolen token.
# =============================================================================

server {
    listen 80;
    server_name cricket.traceodd.com;

    # =========================================================================
    # 1. PUBLIC CRICKET PORTAL (Flutter Web Build — main_cricket_public.dart)
    # =========================================================================
    root /var/www/traceodd/cricket-public-web/;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # 2. HLS STREAMING SEGMENTS (SRS Output — CDN pull origin)
    # =========================================================================
    location /hls/ {
        alias /var/www/traceodd/cricket-hls/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # =========================================================================
    # 3. PUBLIC API — ONLY cricket/public/* IS ALLOWED
    # =========================================================================
    location ^~ /api/v1/cricket/public/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # Laravel API health check
    location = /health {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        include fastcgi_params;
    }

    # Everything else under /api/ is hard-blocked on the public host.
    location ^~ /api/ {
        return 403;
    }

    # =========================================================================
    # 4. UPLOADED FILES (Team Logos, Banners, etc.)
    # =========================================================================
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
        add_header Access-Control-Allow-Origin *;
    }

    # =========================================================================
    # 5. LARAVEL REVERB — WebSocket Proxy (live score fan-out)
    # =========================================================================
    location /app/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    location /apps/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }
}
