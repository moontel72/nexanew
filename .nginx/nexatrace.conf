# =============================================================================
# NexaTrace Nginx Configuration
# Server: 135.181.46.27
# Path: /etc/nginx/sites-available/nexatrace
# =============================================================================
# After editing, run:
#   sudo nginx -t                        # Test config
#   sudo systemctl reload nginx          # Apply changes
# =============================================================================

server {
    listen 80;
    server_name 135.181.46.27;

    # ── Main Admin Panel (Super Admin + Factory) ─────────────────
    location / {
        root /var/www/nexatrace/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Reseller B2B Marketplace App ─────────────────────────────
    # CRITICAL: This block MUST exist for /reseller/* to work.
    # Without it, all /reseller/ requests fall to the main app
    # which redirects to /login.
    location /reseller/ {
        alias /var/www/nexatrace/reseller/;
        index index.html;
        try_files $uri $uri/ /reseller/index.html;
    }

    # ── API Backend (Laravel) ────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Security ─────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
