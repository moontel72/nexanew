# Todd Studio — control plane + WHIP/WHEP signaling + web test page.
#
# Proxies to the media engine (todd-studio) running on 127.0.0.1:8082.
# The WebRTC media plane (SRTP/UDP) does NOT flow through nginx — only the
# HTTP(S) signaling (SDP offer/answer) and the Studio UI do.
#
# TLS: Cloudflare terminates HTTPS at the edge for this zone, so the origin
# stays HTTP (listen 80). If you ever point DNS directly at this box
# (bypassing Cloudflare), uncomment the `listen 443 ssl` block and run:
#   certbot --nginx -d studio.traceodd.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name studio.traceodd.com;

    # Direct-to-origin HTTPS (only when NOT using Cloudflare proxy).
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/studio.traceodd.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/studio.traceodd.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket feeds: /api/v1/telemetry/ws and /api/v1/cricket/ws
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
    }
}
