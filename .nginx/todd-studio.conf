# Todd Studio — production director control room + media engine API.
#
# - `/`          : compiled Todd Studio SPA (deployed to /var/www/todd-studio)
# - `/api/*`     : media engine signaling (rooms, WHIP/WHEP, replay, score)
# - `/healthz`   : media engine health check
#
# WebRTC media (SRTP/UDP) does not flow through nginx — only HTTP(S)
# signaling and the Studio UI do.
#
# TLS: Cloudflare terminates HTTPS at the edge for this zone, so the origin
# stays HTTP (listen 80). For direct-to-origin HTTPS, uncomment the
# `listen 443 ssl` block and run `certbot --nginx -d studio.traceodd.com`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name studio.traceodd.com;

    root /var/www/todd-studio;
    index index.html;

    # Direct-to-origin HTTPS (only when NOT using Cloudflare proxy).
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/studio.traceodd.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/studio.traceodd.com/privkey.pem;

    # Media engine API + WebSocket feeds.
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Liveness / readiness / metrics.
    location = /healthz { proxy_pass http://127.0.0.1:8082; }
    location = /readyz  { proxy_pass http://127.0.0.1:8082; }
    location = /metrics { proxy_pass http://127.0.0.1:8082; }

    # Single-page app with history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
