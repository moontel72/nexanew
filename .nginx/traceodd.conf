# =============================================================================
# NEXATRACE ECOSYSTEM — COMPLETE NGINX CONFIGURATION
# =============================================================================
# Server: 135.181.46.27
# Path:   /etc/nginx/sites-available/nexatrace
#
# ARCHITECTURE:
#   1 Main Admin Panel (Super Admin, Factory, Bus/Goods Company Management)
#   6 Transport Fleet Apps (3 Bus + 3 Goods)
#   1 Reseller Marketplace
#   1 Factory Driver App
#   1 Backend API (Laravel via php-fpm)
# =============================================================================

server {
    listen 80;
    server_name localhost;  # Replace with domain/IP for production

    # =========================================================================
    # 1. MAIN ADMIN PANEL
    #    Super Admin, Factory Admin, Bus Fleet Company, Goods Fleet Company
    #    All served by the main Flutter web build at /var/www/traceodd/frontend/
    # =========================================================================
    location / {
        root /var/www/traceodd/frontend/;
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 2. RESELLER MARKETPLACE APP (separate Flutter build)
    # =========================================================================
    location /reseller/ {
        alias /var/www/traceodd/reseller/;
        try_files $uri $uri/ /reseller/index.html;
    }

    # =========================================================================
    # 3. BUS COMPANY APPLICATION ECOSYSTEM (3 independent Flutter builds)
    # =========================================================================
    location /bus-owner/ {
        alias /var/www/traceodd/bus-owner/;
        try_files $uri $uri/ /bus-owner/index.html;
    }

    location /bus-driver/ {
        alias /var/www/traceodd/bus-driver/;
        try_files $uri $uri/ /bus-driver/index.html;
    }

    location /bus-conductor/ {
        alias /var/www/traceodd/bus-conductor/;
        try_files $uri $uri/ /bus-conductor/index.html;
    }

    # =========================================================================
    # 4. GOODS COMPANY APPLICATION ECOSYSTEM (3 independent Flutter builds)
    # =========================================================================
    location /truck-owner/ {
        alias /var/www/traceodd/truck-owner/;
        try_files $uri $uri/ /truck-owner/index.html;
    }

    location /truck-driver/ {
        alias /var/www/traceodd/truck-driver/;
        try_files $uri $uri/ /truck-driver/index.html;
    }

    location /truck-conductor/ {
        alias /var/www/traceodd/truck-conductor/;
        try_files $uri $uri/ /truck-conductor/index.html;
    }

    # =========================================================================
    # 5. LEGACY FACTORY DRIVER APP (separate Flutter build)
    # =========================================================================
    location /driver/ {
        alias /var/www/traceodd/driver/;
        try_files $uri $uri/ /driver/index.html;
    }

    # =========================================================================
    # 6. BACKEND API — Laravel via PHP-FPM
    # =========================================================================
    location /api/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # =========================================================================
    # 7. UPLOADED FILES
    # =========================================================================
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
    }
}
