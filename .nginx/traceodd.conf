# =============================================================================
# Trace Odd Nginx Configuration
# Server: 135.181.46.27
# Path: /etc/nginx/sites-available/traceodd
# =============================================================================
# After editing, run:
#   sudo nginx -t                        # Test config
#   sudo systemctl reload nginx          # Apply changes
# =============================================================================

server {
    listen 80;
    server_name 135.181.46.27;

    # ── Main Admin Panel (Super Admin + Factory) ─────────────────
    location / {
        root /var/www/traceodd/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Reseller B2B Marketplace App ─────────────────────────────
    location /reseller/ {
        alias /var/www/traceodd/reseller/;
        index index.html;
        try_files $uri $uri/ /reseller/index.html;
    }

    # ── Driver App ───────────────────────────────────────────────
    location /driver/ {
        alias /var/www/traceodd/driver/;
        index index.html;
        try_files $uri $uri/ /driver/index.html;
    }

    # ── API Backend (Laravel) ────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Storage (Laravel uploaded files: products, proofs, etc.) ──
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security ─────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
