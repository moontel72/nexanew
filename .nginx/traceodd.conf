# =============================================================================
# NEXATRACE ECOSYSTEM — COMPLETE NGINX CONFIGURATION (v3 — Domain Split)
# =============================================================================
# Server: 135.181.46.27
# Path:   /etc/nginx/sites-available/traceodd
#
# ARCHITECTURE:
#   traceodd.com / www.traceodd.com → Brand landing page (main_landing.dart)
#   admin.traceodd.com               → Super Admin panel + all sub-path apps
#   cricket.traceodd.com             → cricket-public.conf (public portal)
#   manager.cricket.traceodd.com     → cricket-manager.conf (manager panel)
#   localhost / raw IP               → default: admin panel (dev access)
#
# The Super Admin panel is NO LONGER exposed on the root domain.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────
# SERVER BLOCK 1 — BRAND LANDING PAGE (traceodd.com + www.traceodd.com)
# ─────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name traceodd.com www.traceodd.com;

    root /var/www/traceodd/landing/;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

# ─────────────────────────────────────────────────────────────────────────
# SERVER BLOCK 2 — SUPER ADMIN + SUB-PATH PANEL APPS (admin.traceodd.com)
# ─────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.traceodd.com;

    # =========================================================================
    # 1. MAIN ADMIN PANEL
    # =========================================================================
    location / {
        root /var/www/traceodd/frontend/;
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 2. RESELLER MARKETPLACE APP
    # =========================================================================
    location /reseller/ {
        alias /var/www/traceodd/reseller/;
        try_files $uri $uri/ /reseller/index.html;
    }

    # =========================================================================
    # 3. BUS COMPANY APPS
    # =========================================================================
    location /bus-fleet/ {
        alias /var/www/traceodd/bus-fleet/;
        try_files $uri $uri/ /bus-fleet/index.html;
    }
    location /bus-owner/ {
        alias /var/www/traceodd/bus-owner/;
        try_files $uri $uri/ /bus-owner/index.html;
    }
    location /bus-driver/ {
        alias /var/www/traceodd/bus-driver/;
        try_files $uri $uri/ /bus-driver/index.html;
    }
    location /bus-conductor/ {
        alias /var/www/traceodd/bus-conductor/;
        try_files $uri $uri/ /bus-conductor/index.html;
    }

    # =========================================================================
    # 4. GOODS COMPANY APPS
    # =========================================================================
    location /truck-owner/ {
        alias /var/www/traceodd/truck-owner/;
        try_files $uri $uri/ /truck-owner/index.html;
    }
    location /truck-driver/ {
        alias /var/www/traceodd/truck-driver/;
        try_files $uri $uri/ /truck-driver/index.html;
    }
    location /truck-conductor/ {
        alias /var/www/traceodd/truck-conductor/;
        try_files $uri $uri/ /truck-conductor/index.html;
    }

    # =========================================================================
    # 5. LEGACY FACTORY DRIVER APP
    # =========================================================================
    location /driver/ {
        alias /var/www/traceodd/driver/;
        try_files $uri $uri/ /driver/index.html;
    }

    # =========================================================================
    # 6. BACKEND API — Laravel via PHP-FPM
    # =========================================================================
    location /api/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # =========================================================================
    # 7. UPLOADED FILES
    # =========================================================================
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
    }

    # =========================================================================
    # 8. LARAVEL REVERB — WebSocket Proxy
    # =========================================================================
    location /app/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    location /apps/ {
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }
}

