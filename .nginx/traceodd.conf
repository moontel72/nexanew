# =============================================================================
# Trace Odd — Production Nginx Configuration
# Server: 135.181.46.27
# Path: /etc/nginx/sites-available/traceodd
# =============================================================================
# Test:  sudo nginx -t
# Apply: sudo systemctl reload nginx
# =============================================================================

server {
    listen 80 default_server;
    server_name 135.181.46.27;

    # ──────────────────────────────────────────────────────────────
    # Trailing-slash redirects — prevent fall-through to /
    # ──────────────────────────────────────────────────────────────
    location = /reseller  { return 301 /reseller/;  }
    location = /driver    { return 301 /driver/;    }

    # ──────────────────────────────────────────────────────────────
    # Main Admin Panel (Super Admin, Factory, Bus Fleet, Goods Fleet)
    # All GoRouter paths handled by Flutter SPA fallback
    # ──────────────────────────────────────────────────────────────
    location / {
        root /var/www/traceodd/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ──────────────────────────────────────────────────────────────
    # Reseller B2B Marketplace App (separate Flutter build)
    # ──────────────────────────────────────────────────────────────
    location /reseller/ {
        alias /var/www/traceodd/reseller/;
        index index.html;
        try_files $uri $uri/ /reseller/index.html;
    }

    # ──────────────────────────────────────────────────────────────
    # Factory Driver App (separate Flutter build)
    # ──────────────────────────────────────────────────────────────
    location /driver/ {
        alias /var/www/traceodd/driver/;
        index index.html;
        try_files $uri $uri/ /driver/index.html;
    }

    # ──────────────────────────────────────────────────────────────
    # Laravel API Backend
    # ──────────────────────────────────────────────────────────────
    location /api/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # ──────────────────────────────────────────────────────────────
    # Admin API alias (some routes use /admin/ prefix)
    # ──────────────────────────────────────────────────────────────
    location /admin/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # ──────────────────────────────────────────────────────────────
    # Laravel Storage (uploaded files)
    # ──────────────────────────────────────────────────────────────
    location /storage/ {
        alias /var/www/traceodd/admin-panel/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ──────────────────────────────────────────────────────────────
    # Security
    # ──────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
