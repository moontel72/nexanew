# Todd Studio — direct-to-origin (IP) test vhost.
#
# ⚠️  DO NOT put this on port 80 with `server_name 135.181.46.27`.
# ---------------------------------------------------------------------------
# An earlier revision of this file did exactly that, and it broke the main app
# on the raw IP. Why:
#
#   * `.nginx/traceodd.conf` block 3 is already `listen 80 default_server;
#     server_name localhost 135.181.46.27;` — the raw IP is meant to serve the
#     Super Admin / Sub-Admin app (`/var/www/traceodd/frontend/`).
#   * When TWO server blocks on the same port claim the same `server_name`,
#     nginx prefers the exact match and, among duplicates, the one it loads
#     FIRST from sites-enabled (alphabetical: `todd-studio-ip` before
#     `traceodd`). This file therefore shadowed the app host.
#   * Because this vhost's `location /` ends in `try_files $uri $uri/ /index.html`,
#     every unknown path fell back to this SPA's index.html. Symptom reported:
#     `http://135.181.46.27/sub-admin/login` showed the Todd Studio login page
#     instead of the Sub-Admin login.
#
# This vhost therefore listens on a dedicated port (8081) so it can NEVER
# shadow the main app on port 80. Todd Studio's production host is
# `studio.traceodd.com` (`.nginx/todd-studio.conf`) — this file has no effect on
# it.
# ---------------------------------------------------------------------------
#
# Purpose preserved: serve the same Studio SPA + API as studio.traceodd.com on
# the bare VPS IP, bypassing Cloudflare entirely. Used to isolate
# Cloudflare/domain-level issues from engine-level ones: if a WHIP/WHEP client
# works here but not through the domain, the edge layer is the problem; if it
# fails here too, the engine/protocol is.
#
# Install (VPS):
#   cp .nginx/todd-studio-ip.conf /etc/nginx/sites-available/todd-studio-ip
#   ln -sf /etc/nginx/sites-available/todd-studio-ip /etc/nginx/sites-enabled/todd-studio-ip
#   nginx -t && systemctl reload nginx
#
# Reach it at: http://135.181.46.27:8081/

# Unique map name: the domain vhost already defines `$connection_upgrade`.
map $http_upgrade $ip_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8081;
    server_name 135.181.46.27;

    root /var/www/todd-studio;
    index index.html;

    # Phase-1 SSO login — same-origin proxy to the Laravel admin-panel
    # PHP-FPM (identical to the studio.traceodd.com vhost).
    location ^~ /api/v1/studio/ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/traceodd/admin-panel/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # Media engine API + WebSocket feeds.
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $ip_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Liveness / readiness / metrics.
    location = /healthz { proxy_pass http://127.0.0.1:8082; }
    location = /readyz  { proxy_pass http://127.0.0.1:8082; }
    location = /metrics { proxy_pass http://127.0.0.1:8082; }

    # Single-page app with history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
