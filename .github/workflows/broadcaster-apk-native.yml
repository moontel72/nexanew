name: Build Native Todd Broadcaster APK

# ============================================================================
# Builds the NATIVE Kotlin Todd Broadcaster APK (apps/broadcaster-android)
# and publishes it to the download server:
#
#   https://traceodd.com/download/broadcaster/todd-broadcaster.apk
#
# This replaces the old Flutter broadcaster build (broadcaster-apk.yml).
# The native app talks WebRTC directly (MediaCodec + Camera2) for stable,
# Larix-like performance on low-end devices (Samsung Galaxy J-series, etc.).
#
# Triggers:
#   - push to mainnew touching apps/broadcaster-android/**
#     (keeps the published APK in sync with native app fixes automatically)
#   - manual workflow_dispatch (build on demand)
# ============================================================================

on:
  push:
    branches:
      - mainnew
    paths:
      - "apps/broadcaster-android/**"
      - ".github/workflows/broadcaster-apk-native.yml"
  workflow_dispatch:

# One build at a time; a newer push supersedes a queued one.
concurrency:
  group: broadcaster-apk-native
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Command-line tools + platform/build-tools licences. AGP then pulls the
      # exact SDK 34 / build-tools 34.0.0 components during the Gradle build.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Explicitly install the exact SDK components AGP 8.2.2 requires.
      # The setup-android action installs the latest platform (e.g. android-35),
      # but this project targets compileSdk 34. Auto-download can fail on CI,
      # so we install them explicitly to ensure they're available.
      - name: Install required SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # Regenerate local.properties with the CI SDK path. The file was
      # previously committed with a Windows path that breaks Linux CI.
      - name: Regenerate local.properties
        working-directory: apps/broadcaster-android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # The Gradle wrapper is committed, but regenerate it if it is ever
      # missing so the build never depends on a stale/absent gradlew.
      - name: Prepare Gradle wrapper
        working-directory: apps/broadcaster-android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.5
            chmod +x ./gradlew
          fi

      # Optional: supply a persistent release keystore so cameramen can update
      # the app in place. When these secrets are absent the Gradle release
      # build falls back to debug signing (still installable). See
      # apps/broadcaster-android/app/build.gradle.kts.
      - name: Decode release keystore (if configured)
        env:
          BROADCASTER_KEYSTORE_BASE64: ${{ secrets.BROADCASTER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BROADCASTER_KEYSTORE_BASE64" ]; then
            echo "$BROADCASTER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/broadcaster-release.jks"
            echo "BROADCASTER_KEYSTORE_PATH=$RUNNER_TEMP/broadcaster-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: apps/broadcaster-android
        env:
          BROADCASTER_KEYSTORE_PASSWORD: ${{ secrets.BROADCASTER_KEYSTORE_PASSWORD }}
          BROADCASTER_KEY_ALIAS: ${{ secrets.BROADCASTER_KEY_ALIAS }}
          BROADCASTER_KEY_PASSWORD: ${{ secrets.BROADCASTER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todd-broadcaster-native-apk
          path: apps/broadcaster-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      # ── Permanent download links ────────────────────────────────
      # The native build ships a single universal APK (all ABIs from the
      # WebRTC dependency), so the same file is published under both the
      # default and the legacy 32-bit names. No GitHub account needed.
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KYE_HATZNER }}

      - name: Deploy APK to download server
        env:
          APK: apps/broadcaster-android/app/build/outputs/apk/release/app-release.apk
        run: |
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "mkdir -p /var/www/traceodd/download/broadcaster"
          scp -o StrictHostKeyChecking=no "$APK" \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/download/broadcaster/todd-broadcaster.apk
          # Universal APK also serves the legacy 32-bit download name.
          scp -o StrictHostKeyChecking=no "$APK" \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/download/broadcaster/todd-broadcaster-32bit.apk
          # Verify on the SERVER (ls on the runner would look in the
          # wrong filesystem and fail the step after a successful upload).
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "ls -la /var/www/traceodd/download/broadcaster/"
          echo "✅ Native Broadcaster APK live at https://traceodd.com/download/broadcaster/"
