name: Deploy Flutter Web Frontend

on:
  push:
    branches:
      - main
      - mainnew
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "desktop-download/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "rust/**"
      - ".nginx/**"
      - ".scripts/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Flutter clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      # 🔥 SSH Setup
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KYE_HATZNER }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 135.181.46.27 >> ~/.ssh/known_hosts 2>/dev/null
          # Fallback: disable strict checking if keyscan fails
          echo 'Host 135.181.46.27' >> ~/.ssh/config
          echo '  StrictHostKeyChecking no' >> ~/.ssh/config
          echo '  UserKnownHostsFile=/dev/null' >> ~/.ssh/config

      # ──────────────────────────────────────────────────────────────
      # STEP A: Build & Deploy Admin Panel (main.dart) — PRIMARY
      # Served at admin.traceodd.com
      # ──────────────────────────────────────────────────────────────

      - name: Build Admin Panel (main.dart)
        run: |
          flutter build web --release
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Admin-branded PWA manifest (name/icons) for installs from this host
          cp web/manifest-admin.json build/web/manifest.json

      - name: Verify Admin Panel build
        run: |
          if [ ! -f "build/web/index.html" ]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi
          echo "✅ Admin Panel build verified ($(du -sh build/web | cut -f1))"

      - name: Deploy Admin Panel to /frontend/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/frontend/

      # ──────────────────────────────────────────────────────────────
      # STEP B: Build & Deploy Landing Page (main_landing.dart)
      # Served at traceodd.com + www.traceodd.com
      # ──────────────────────────────────────────────────────────────

      - name: Build Landing Page (main_landing.dart)
        run: |
          flutter build web --release --target=lib/main_landing.dart --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Landing Page to /landing/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/landing/

      # ──────────────────────────────────────────────────────────────
      # STEP B2: Desktop App Download Portal (traceodd.com/download)
      # Page + logo ship on every deploy; the installers are seeded from
      # the last GitHub Release and replaced by the signed desktop
      # pipeline on each version tag (desktop-build.yml).
      # ──────────────────────────────────────────────────────────────

      - name: Deploy Desktop Download Portal
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "mkdir -p /var/www/traceodd/download/windows /var/www/traceodd/updates"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --progress desktop-download/ root@135.181.46.27:/var/www/traceodd/download/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            test -f /var/www/traceodd/download/windows/latest-setup.exe || \
              curl -fsSL -o /var/www/traceodd/download/windows/latest-setup.exe \
                https://github.com/moontel72/nexanew/releases/download/v0.1.0/Todd.Studio_0.1.0_x64-setup.exe || true
            test -f /var/www/traceodd/download/windows/latest-en-US.msi || \
              curl -fsSL -o /var/www/traceodd/download/windows/latest-en-US.msi \
                https://github.com/moontel72/nexanew/releases/download/v0.1.0/Todd.Studio_0.1.0_x64_en-US.msi || true
            ls -la /var/www/traceodd/download/ /var/www/traceodd/download/windows/
          "

      # ──────────────────────────────────────────────────────────────
      # STEP C: Build & Deploy Cricket Public Portal
      # (main_cricket_public.dart) → cricket.traceodd.com
      # ──────────────────────────────────────────────────────────────

      - name: Build Cricket Public Portal (main_cricket_public.dart)
        run: |
          flutter build web --release \
            --target=lib/main_cricket_public.dart \
            --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Cricket-branded PWA manifest (name/icons) for installs from this host
          cp web/manifest-cricket.json build/web/manifest.json

      - name: Deploy Cricket Public Portal to /cricket-public-web/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/cricket-public-web/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "echo \"deployed=\$(date -u +%s)\" > /var/www/traceodd/cricket-public-web/version.txt"

      # ──────────────────────────────────────────────────────────────
      # STEP D: Build & Deploy Cricket Manager Panel
      # (main_cricket_manager.dart) → cricket-manager.traceodd.com
      # ──────────────────────────────────────────────────────────────

      - name: Build Cricket Manager Panel (main_cricket_manager.dart)
        run: |
          flutter build web --release \
            --target=lib/main_cricket_manager.dart \
            --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Manager-branded PWA manifest (name/icons) for installs from this host
          cp web/manifest-cricket-manager.json build/web/manifest.json

      - name: Deploy Cricket Manager Panel to /cricket-manager-web/
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "mkdir -p /var/www/traceodd/cricket-manager-web"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/cricket-manager-web/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            test -f /var/www/traceodd/cricket-manager-web/index.html && echo '✅ Manager index.html present' || { echo '❌ Manager index.html MISSING after rsync'; exit 1; }
            echo \"deployed=\$(date -u +%s)\" > /var/www/traceodd/cricket-manager-web/version.txt
          "

      # ──────────────────────────────────────────────────────────────
      # STEP D2: Build & Deploy Todd Broadcaster Web (main_broadcaster.dart)
      # → broadcaster.traceodd.com (mobile ground-camera PWA)
      # ──────────────────────────────────────────────────────────────

      - name: Build Todd Broadcaster Web (main_broadcaster.dart)
        run: |
          flutter build web --release \
            --target=lib/main_broadcaster.dart \
            --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Broadcaster-branded PWA manifest (name/icons)
          cp web/manifest-broadcaster.json build/web/manifest.json

      - name: Deploy Broadcaster Web to /broadcaster-web/
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "mkdir -p /var/www/traceodd/broadcaster-web"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/broadcaster-web/

      # ──────────────────────────────────────────────────────────────
      # STEP E: Build & Deploy Reseller App (main_reseller.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Reseller App (main_reseller.dart)
        run: |
          flutter build web --release --target=lib/main_reseller.dart --base-href "/reseller/"
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Reseller App to /reseller/
        continue-on-error: true
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/reseller/

      # ──────────────────────────────────────────────────────────────
      # STEP F: Build & Deploy Driver App (main_driver.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Driver App (main_driver.dart)
        run: |
          flutter build web --release --target=lib/main_driver.dart --base-href "/driver/"
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Driver App to /driver/
        continue-on-error: true
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/driver/

      # ──────────────────────────────────────────────────────────────
      # STEP G: Build & Deploy Bus Owner App (main_bus_owner.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Bus Owner App (main_bus_owner.dart)
        run: |
          flutter build web --release --target=lib/main_bus_owner.dart --base-href "/bus-owner/" --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Bus Owner App to /bus-owner/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/bus-owner/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "echo \"deployed=\$(date -u +%s)\" >> /var/www/traceodd/bus-owner/version.txt"

      # ──────────────────────────────────────────────────────────────
      # STEP H: Build & Deploy Bus Fleet Admin Panel (main_bus_fleet.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Bus Fleet Admin (main_bus_fleet.dart)
        run: |
          flutter build web --release --target=lib/main_bus_fleet.dart --base-href "/bus-fleet/" --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Bus Fleet Admin to /bus-fleet/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/bus-fleet/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "echo \"deployed=\$(date -u +%s)\" >> /var/www/traceodd/bus-fleet/version.txt"

      # ──────────────────────────────────────────────────────────────
      # STEP I: Copy Nginx configs (traceodd + cricket dual-panel) & reload
      # ──────────────────────────────────────────────────────────────

      - name: Deploy Nginx Configurations
        run: |
          scp -o StrictHostKeyChecking=no .nginx/traceodd.conf root@135.181.46.27:/etc/nginx/sites-available/traceodd
          scp -o StrictHostKeyChecking=no .nginx/cricket-public.conf root@135.181.46.27:/etc/nginx/sites-available/cricket-public
          scp -o StrictHostKeyChecking=no .nginx/cricket-manager.conf root@135.181.46.27:/etc/nginx/sites-available/cricket-manager
          scp -o StrictHostKeyChecking=no .nginx/broadcaster.conf root@135.181.46.27:/etc/nginx/sites-available/broadcaster
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            ln -sf /etc/nginx/sites-available/cricket-public /etc/nginx/sites-enabled/cricket-public
            ln -sf /etc/nginx/sites-available/cricket-manager /etc/nginx/sites-enabled/cricket-manager
            ln -sf /etc/nginx/sites-available/broadcaster /etc/nginx/sites-enabled/broadcaster
            rm -f /etc/nginx/sites-enabled/cricket
            rm -f /etc/nginx/sites-available/cricket.disabled
            nginx -t && systemctl reload nginx

            MANAGER_CC=\$(curl -sI -H 'Host: cricket-manager.traceodd.com' http://127.0.0.1/ | tr -d '\r' | grep -i '^cache-control' || true)
            PUBLIC_CC=\$(curl -sI -H 'Host: cricket.traceodd.com' http://127.0.0.1/ | tr -d '\r' | grep -i '^cache-control' || true)
            echo \"manager cache-control: \$MANAGER_CC\"
            echo \"public  cache-control: \$PUBLIC_CC\"
            case \"\$MANAGER_CC\" in
              *no-cache*) echo '✅ Cricket manager block live' ;;
              *) echo '❌ cricket-manager.traceodd.com NOT matched by its server block'; exit 1 ;;
            esac
            case \"\$PUBLIC_CC\" in
              *no-cache*) echo '✅ Cricket public block live' ;;
              *) echo '❌ cricket.traceodd.com NOT matched by its server block'; exit 1 ;;
            esac
          "

      # ──────────────────────────────────────────────────────────────
      # Post-Deployment: Fix permissions for all apps
      # ──────────────────────────────────────────────────────────────

      - name: Post-Deployment Permissions Fix
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            chown -R www-data:www-data /var/www/traceodd/frontend && \
            chmod -R 755 /var/www/traceodd/frontend && \
            chown -R www-data:www-data /var/www/traceodd/landing && \
            chmod -R 755 /var/www/traceodd/landing && \
            chown -R www-data:www-data /var/www/traceodd/cricket-public-web && \
            chmod -R 755 /var/www/traceodd/cricket-public-web && \
            chown -R www-data:www-data /var/www/traceodd/cricket-manager-web && \
            chmod -R 755 /var/www/traceodd/cricket-manager-web && \
            chown -R www-data:www-data /var/www/traceodd/broadcaster-web && \
            chmod -R 755 /var/www/traceodd/broadcaster-web && \
            chown -R www-data:www-data /var/www/traceodd/reseller && \
            chmod -R 755 /var/www/traceodd/reseller && \
            chown -R www-data:www-data /var/www/traceodd/driver && \
            chmod -R 755 /var/www/traceodd/driver && \
            chown -R www-data:www-data /var/www/traceodd/bus-owner && \
            chmod -R 755 /var/www/traceodd/bus-owner && \
            chown -R www-data:www-data /var/www/traceodd/bus-fleet && \
            chmod -R 755 /var/www/traceodd/bus-fleet && \
            systemctl reload nginx
          "
