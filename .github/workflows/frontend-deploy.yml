name: Deploy Flutter Web Frontend

on:
  push:
    branches:
      - mainnew
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Flutter clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 135.181.46.27 >> ~/.ssh/known_hosts

      - name: Deploy to Hetzner (Flutter Web)
        run: |
          # --chown use karne se owner upload ke waqt hi set ho jata hai
          rsync -avz --delete --progress build/web/ root@135.181.46.27:/var/www/nexatrace/frontend/

      - name: Post-Deployment Permissions Fix
        run: |
          # Yeh step confirm karega ke owner www-data hi rahe (1001 khatam ho jaye)
          ssh root@135.181.46.27 "
            chown -R www-data:www-data /var/www/nexatrace/frontend && \
            chmod -R 755 /var/www/nexatrace/frontend
          "