name: Deploy Flutter Web Frontend

on:
  push:
    branches:
      - main
      - mainnew
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "desktop-download/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "rust/**"
      - ".nginx/**"
      - ".scripts/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

# Serialize every VPS deploy (see deploy.yml for why).
concurrency:
  group: frontend-deploy-hetzner
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Flutter clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      # ──────────────────────────────────────────────────────────────
      # Static analysis gate — runs before any build or deploy work so a
      # type error fails fast instead of shipping.
      #
      # `flutter build web` only checks the code reachable from ONE entry
      # point, and only 8 of the 13 `lib/main_*.dart` targets are built at
      # all. `dart analyze` covers the whole `lib/` tree, including the five
      # unbuilt panels and every file no entry point imports.
      #
      # `--no-fatal-warnings` is deliberate: the tree currently carries 57
      # pre-existing warnings (46 of them mechanical: unused_field 14,
      # unused_local_variable 13, dead_null_aware_expression 12,
      # unused_element 8, unused_import 5) plus 29 deprecation infos, and 0
      # errors. Treating those as fatal would block every deploy until the
      # backlog is cleared, which is a separate change. This gate therefore
      # catches ERRORS today; tighten it by clearing the backlog and then
      # dropping the flag.
      # ──────────────────────────────────────────────────────────────
      - name: Dart analyze
        run: dart analyze --no-fatal-warnings

      # ──────────────────────────────────────────────────────────────
      # Runs the widget and bloc tests — 35 of them at the time of writing,
      # including test/features/cricket/presentation/blocs/team/team_bloc_test.dart.
      #
      # Correcting an earlier claim: the gap was never "there are no Flutter
      # tests", it was that **no workflow ran `flutter test` at all**, so the
      # tests that exist had never executed in CI. A predecessor report said the
      # only test was a 17-line placeholder; that was wrong, and it mattered — it
      # made the fix look like "write a test" instead of "run the suite".
      #
      # These run without a network, a database or GStreamer, so they are safe
      # here and fast.
      - name: Flutter test
        run: flutter test

      # 🔥 SSH Setup
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KYE_HATZNER }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 135.181.46.27 >> ~/.ssh/known_hosts 2>/dev/null
          # Fallback: disable strict checking if keyscan fails
          echo 'Host 135.181.46.27' >> ~/.ssh/config
          echo '  StrictHostKeyChecking no' >> ~/.ssh/config
          echo '  UserKnownHostsFile=/dev/null' >> ~/.ssh/config

      # ──────────────────────────────────────────────────────────────
      # STEP A: Build & Deploy Admin Panel (main.dart) — PRIMARY
      # Served at admin.traceodd.com
      # ──────────────────────────────────────────────────────────────

      - name: Build Admin Panel (main.dart)
        run: |
          # --pwa-strategy none (MASTER-TASK-LIST.md item 10): without it Flutter
          # generated flutter_service_worker.js AND baked its version into
          # flutter_bootstrap.js, while the `rm -f` below deleted the file - so every
          # visitor's loader registered a file that 404s as text/html. This panel
          # ships its own worker (web/sw.js, registered by the template) instead.
          # version-web-build.sh now fails the build if this is ever regressed.
          flutter build web --release --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Admin-branded PWA manifest (name/icons) for installs from this host
          cp web/manifest-admin.json build/web/manifest.json
          # Phones must be able to pinch-zoom (owner, 2026-09-29). Fail loudly if the
          # template lost the viewport, instead of shipping a site nobody can zoom.
          grep -q 'user-scalable=yes' build/web/index.html || { echo '❌ viewport is not zoomable in build/web/index.html'; exit 1; }
          grep -q 'touch-action: pinch-zoom' build/web/index.html || { echo '❌ build/web/index.html is missing the touch-action pinch-zoom override'; exit 1; }

      - name: Verify Admin Panel build
        run: |
          if [ ! -f "build/web/index.html" ]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi
          echo "✅ Admin Panel build verified ($(du -sh build/web | cut -f1))"

      - name: Deploy Admin Panel to /frontend/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/frontend/

      # ──────────────────────────────────────────────────────────────
      # STEP B: Build & Deploy Landing Page (main_landing.dart)
      # Served at traceodd.com + www.traceodd.com
      # ──────────────────────────────────────────────────────────────

      - name: Build Landing Page (main_landing.dart)
        run: |
          flutter build web --release --target=lib/main_landing.dart --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Phones must be able to pinch-zoom (owner, 2026-09-29) - traceodd.com was
          # the site with NO protection at all. Fail loudly rather than ship it broken.
          grep -q 'user-scalable=yes' build/web/index.html || { echo '❌ landing viewport is not zoomable'; exit 1; }
          grep -q 'MutationObserver' build/web/index.html || { echo '❌ landing is missing the viewport re-assert script'; exit 1; }
          grep -q 'touch-action: pinch-zoom' build/web/index.html || { echo '❌ landing is missing the touch-action pinch-zoom override (Flutter suppresses browser zoom without it)'; exit 1; }

      - name: Deploy Landing Page to /landing/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/landing/

      # ──────────────────────────────────────────────────────────────
      # STEP B2: Desktop App Download Portal (traceodd.com/download)
      # Page + logo ship on every deploy; the installers are seeded from
      # the last GitHub Release and replaced by the signed desktop
      # pipeline on each version tag (desktop-build.yml).
      # ──────────────────────────────────────────────────────────────

      - name: Deploy Desktop Download Portal
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "mkdir -p /var/www/traceodd/download/windows /var/www/traceodd/updates"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --progress desktop-download/ root@135.181.46.27:/var/www/traceodd/download/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            test -f /var/www/traceodd/download/windows/latest-setup.exe || \
              curl -fsSL -o /var/www/traceodd/download/windows/latest-setup.exe \
                https://github.com/moontel72/nexanew/releases/download/v0.1.0/Todd.Studio_0.1.0_x64-setup.exe || true
            test -f /var/www/traceodd/download/windows/latest-en-US.msi || \
              curl -fsSL -o /var/www/traceodd/download/windows/latest-en-US.msi \
                https://github.com/moontel72/nexanew/releases/download/v0.1.0/Todd.Studio_0.1.0_x64_en-US.msi || true
            ls -la /var/www/traceodd/download/ /var/www/traceodd/download/windows/
          "

      # ──────────────────────────────────────────────────────────────
      # STEP C: Build & Deploy Cricket Public Portal
      # (main_cricket_public.dart) → cricket.traceodd.com
      # ──────────────────────────────────────────────────────────────

      - name: Build Cricket Public Portal (main_cricket_public.dart)
        run: |
          # Pin the API origin explicitly. `main_cricket_public.dart` documents
          # this build with --dart-define=API_BASE_URL=https://cricket.traceodd.com,
          # but the step was missing it. Without the define the app falls back to
          # `Uri.base.origin` (fine on the canonical host, but one redirect or an
          # origin mismatch silently sends every API call — and so every WHEP
          # lookup — somewhere else, and `getWhepTarget()` then returns null and
          # the page quietly stays on HLS).
          flutter build web --release \
            --target=lib/main_cricket_public.dart \
            --dart-define=API_BASE_URL=https://cricket.traceodd.com \
            --source-maps \
            --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Cricket-branded PWA manifest (name/icons) for installs from this host
          cp web/manifest-cricket.json build/web/manifest.json

      - name: Deploy Cricket Public Portal to /cricket-public-web/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/cricket-public-web/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "echo \"deployed=\$(date -u +%s)\" > /var/www/traceodd/cricket-public-web/version.txt"

      # ------------------------------------------------------------------ #
      # Cache guard: prove the PUBLIC site is actually serving THIS build.
      #
      # Why this exists: the origin stamps every build (`main.dart.<stamp>.js`
      # plus `flutter_bootstrap.js?v=<stamp>` in index.html), but the zone can
      # still hand a returning browser a cached `index.html` — and index.html
      # is the file that carries the stamp, so the browser then runs an OLD
      # bundle for hours. That is what made a fully-correct WHEP client look
      # like it was still on HLS. Failing the deploy here turns "the fix did
      # not work" into "Cloudflare is caching index.html", which is a different
      # problem with a different fix (none of them require guessing again).
      # ------------------------------------------------------------------ #
      - name: Verify Cricket Public bundle is served (cache guard)
        run: |
          STAMP=$(grep -o 'flutter_bootstrap.js?v=[^"]*' build/web/index.html | head -1 || true)
          if [ -z "$STAMP" ]; then
            echo 'No flutter_bootstrap.js stamp in the build - skipping the guard.'
            exit 0
          fi
          echo "built stamp: $STAMP"

          ORIGIN=$(ssh -o StrictHostKeyChecking=no root@135.181.46.27 "grep -o 'flutter_bootstrap.js?v=[^\"]*' /var/www/traceodd/cricket-public-web/index.html | head -1 || true")
          echo "origin stamp: $ORIGIN"
          if [ "$ORIGIN" != "$STAMP" ]; then
            echo "FAIL: the origin index.html does not carry the stamp just built ($STAMP)."
            exit 1
          fi

          for attempt in 1 2 3 4 5 6; do
            LIVE=$(curl -s -H 'Cache-Control: no-cache' "https://cricket.traceodd.com/index.html?cb=$(date +%s)" | grep -o 'flutter_bootstrap.js?v=[^"]*' | head -1 || true)
            if [ "$LIVE" = "$STAMP" ]; then
              echo "OK: the public site serves the new stamp ($STAMP)."
              exit 0
            fi
            echo "public stamp not updated yet (attempt $attempt/6): '$LIVE'"
            sleep 10
          done

          echo 'FAIL: the PUBLIC index.html is stale although the origin is correct.'
          echo 'This is a Cloudflare cache problem, not a build problem.'
          echo 'Fix (once, then no manual purge is ever needed again):'
          echo '  1. Cloudflare > Caching > Configuration > Browser Cache TTL = Respect Existing Headers'
          echo '  2. Cloudflare > Caching > Cache Rules > add: hostname eq cricket.traceodd.com AND URI Path equals /index.html -> Bypass cache'
          echo '  3. (optional, for this once) Caching > Configuration > Purge Everything'
          exit 1

      # ──────────────────────────────────────────────────────────────
      # STEP D: Build & Deploy Cricket Manager Panel
      # (main_cricket_manager.dart) → cricket-manager.traceodd.com
      # ──────────────────────────────────────────────────────────────

      - name: Build Cricket Manager Panel (main_cricket_manager.dart)
        run: |
          # --source-maps: so a production crash reports the real Dart file and
          # line instead of an opaque `main.dart.<stamp>.js:97029` frame. The
          # Cricket Manager had two `Null check operator used on a null value`
          # crashes (back-to-dashboard after adding a score, and opening Live
          # Video) that could not be located from the minified stack at all.
          flutter build web --release \
            --target=lib/main_cricket_manager.dart \
            --source-maps \
            --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Manager-branded PWA manifest (name/icons) for installs from this host
          cp web/manifest-cricket-manager.json build/web/manifest.json

      - name: Deploy Cricket Manager Panel to /cricket-manager-web/
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "mkdir -p /var/www/traceodd/cricket-manager-web"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/cricket-manager-web/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            test -f /var/www/traceodd/cricket-manager-web/index.html && echo '✅ Manager index.html present' || { echo '❌ Manager index.html MISSING after rsync'; exit 1; }
            echo \"deployed=\$(date -u +%s)\" > /var/www/traceodd/cricket-manager-web/version.txt
          "

      # ──────────────────────────────────────────────────────────────
      # STEP E: Build & Deploy Reseller App (main_reseller.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Reseller App (main_reseller.dart)
        run: |
          # --pwa-strategy none: same as the admin panel (item 10) - the template
          # registers web/sw.js itself, and Flutter's removed worker must never be
          # referenced by the loader (version-web-build.sh enforces this).
          flutter build web --release --target=lib/main_reseller.dart --base-href "/reseller/" --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Reseller App to /reseller/
        continue-on-error: true
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/reseller/

      # ──────────────────────────────────────────────────────────────
      # STEP F: Build & Deploy Driver App (main_driver.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Driver App (main_driver.dart)
        run: |
          # --pwa-strategy none: same as the admin panel (item 10) - the template
          # registers web/sw.js itself, and Flutter's removed worker must never be
          # referenced by the loader (version-web-build.sh enforces this).
          flutter build web --release --target=lib/main_driver.dart --base-href "/driver/" --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Driver App to /driver/
        continue-on-error: true
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/driver/

      # ──────────────────────────────────────────────────────────────
      # STEP G: Build & Deploy Bus Owner App (main_bus_owner.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Bus Owner App (main_bus_owner.dart)
        run: |
          flutter build web --release --target=lib/main_bus_owner.dart --base-href "/bus-owner/" --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Bus Owner App to /bus-owner/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/bus-owner/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "echo \"deployed=\$(date -u +%s)\" >> /var/www/traceodd/bus-owner/version.txt"

      # ──────────────────────────────────────────────────────────────
      # STEP H: Build & Deploy Bus Fleet Admin Panel (main_bus_fleet.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Bus Fleet Admin (main_bus_fleet.dart)
        run: |
          flutter build web --release --target=lib/main_bus_fleet.dart --base-href "/bus-fleet/" --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web

      - name: Deploy Bus Fleet Admin to /bus-fleet/
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/bus-fleet/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "echo \"deployed=\$(date -u +%s)\" >> /var/www/traceodd/bus-fleet/version.txt"

      # ──────────────────────────────────────────────────────────────
      # STEP H2: Build & Deploy Public Marketplace (main_marketplace.dart)
      # → market.traceodd.com  (MASTER-TASK-LIST.md §4 done-ledger item #12)
      # ──────────────────────────────────────────────────────────────

      - name: Build Public Marketplace (main_marketplace.dart)
        run: |
          flutter build web --release --target=lib/main_marketplace.dart --pwa-strategy none
          rm -f build/web/flutter_service_worker.js
          bash .scripts/version-web-build.sh build/web
          # Marketplace-branded PWA manifest (name/icons) for installs from this host
          cp web/manifest-marketplace.json build/web/manifest.json
          # Marketplace head: a ZOOMABLE viewport (pinch zoom + pan on phones) plus the
          # marketplace title/description/theme colour.
          #
          # PATCH the built file - do NOT copy a template over it. The built index.html
          # holds the base href Flutter resolved for THIS build; the first version of
          # this step overwrote it with a template carrying Flutter's literal
          # "$FLUTTER_BASE_HREF" placeholder, which made market.traceodd.com render
          # blank with "The base href has to end with a /" (2026-09-29).
          python3 .scripts/patch-marketplace-head.py build/web/index.html

      - name: Deploy Public Marketplace to /marketplace-web/
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "mkdir -p /var/www/traceodd/marketplace-web"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --progress build/web/ root@135.181.46.27:/var/www/traceodd/marketplace-web/
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            test -f /var/www/traceodd/marketplace-web/index.html && echo '✅ Marketplace index.html present' || { echo '❌ Marketplace index.html MISSING after rsync'; exit 1; }
            # Guard against the 2026-09-29 blank-page incident: an unresolved placeholder,
            # or a base href that does not end in '/', makes Flutter refuse to boot.
            if grep -q 'FLUTTER_BASE_HREF' /var/www/traceodd/marketplace-web/index.html; then
              echo '❌ Marketplace index.html still contains the literal FLUTTER_BASE_HREF placeholder - the page would render blank'; exit 1;
            fi
            grep -qE 'base href=\"[^\"]*/\"' /var/www/traceodd/marketplace-web/index.html && echo '✅ Marketplace base href ends with /' || { echo '❌ Marketplace base href does not end with / - the page would render blank'; exit 1; }
            grep -q 'user-scalable=yes' /var/www/traceodd/marketplace-web/index.html && echo '✅ Marketplace viewport is zoomable' || echo '⚠️  Marketplace viewport patch did not apply (zoom will be disabled)'
            echo \"deployed=\$(date -u +%s)\" > /var/www/traceodd/marketplace-web/version.txt
          "

      # ──────────────────────────────────────────────────────────────
      # STEP I: Copy Nginx configs (traceodd + cricket dual-panel) & reload
      # ──────────────────────────────────────────────────────────────

      - name: Deploy Nginx Configurations
        run: |
          scp -o StrictHostKeyChecking=no .nginx/traceodd.conf root@135.181.46.27:/etc/nginx/sites-available/traceodd
          scp -o StrictHostKeyChecking=no .nginx/cricket-public.conf root@135.181.46.27:/etc/nginx/sites-available/cricket-public
          scp -o StrictHostKeyChecking=no .nginx/cricket-manager.conf root@135.181.46.27:/etc/nginx/sites-available/cricket-manager
          scp -o StrictHostKeyChecking=no .nginx/marketplace.conf root@135.181.46.27:/etc/nginx/sites-available/marketplace
          scp -o StrictHostKeyChecking=no .nginx/subadmin.conf root@135.181.46.27:/etc/nginx/sites-available/subadmin
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            ln -sf /etc/nginx/sites-available/cricket-public /etc/nginx/sites-enabled/cricket-public
            ln -sf /etc/nginx/sites-available/cricket-manager /etc/nginx/sites-enabled/cricket-manager
            ln -sf /etc/nginx/sites-available/marketplace /etc/nginx/sites-enabled/marketplace
            ln -sf /etc/nginx/sites-available/subadmin /etc/nginx/sites-enabled/subadmin
            rm -f /etc/nginx/sites-enabled/cricket
            rm -f /etc/nginx/sites-available/cricket.disabled
            nginx -t && systemctl reload nginx

            MANAGER_CC=\$(curl -sI -H 'Host: cricket-manager.traceodd.com' http://127.0.0.1/ | tr -d '\r' | grep -i '^cache-control' || true)
            PUBLIC_CC=\$(curl -sI -H 'Host: cricket.traceodd.com' http://127.0.0.1/ | tr -d '\r' | grep -i '^cache-control' || true)
            MARKET_CC=\$(curl -sI -H 'Host: market.traceodd.com' http://127.0.0.1/ | tr -d '\r' | grep -i '^cache-control' || true)
            ADMIN_CC=\$(curl -sI -H 'Host: admin.traceodd.com' http://127.0.0.1/ | tr -d '\r' | grep -i '^cache-control' || true)
            SUBADMIN_LOC=\$(curl -sI -H 'Host: subadmin.traceodd.com' http://127.0.0.1/ | tr -d '\r' | grep -i '^location' || true)
            echo \"manager cache-control: \$MANAGER_CC\"
            echo \"public  cache-control: \$PUBLIC_CC\"
            echo \"market  cache-control: \$MARKET_CC\"
            echo \"admin   cache-control: \$ADMIN_CC\"
            echo \"subadmin location:       \$SUBADMIN_LOC\"
            case \"\$MANAGER_CC\" in
              *no-cache*) echo '✅ Cricket manager block live' ;;
              *) echo '❌ cricket-manager.traceodd.com NOT matched by its server block'; exit 1 ;;
            esac
            case \"\$PUBLIC_CC\" in
              *no-cache*) echo '✅ Cricket public block live' ;;
              *) echo '❌ cricket.traceodd.com NOT matched by its server block'; exit 1 ;;
            esac
            case \"\$MARKET_CC\" in
              *no-cache*) echo '✅ Marketplace block live' ;;
              *) echo '⚠️  market.traceodd.com NOT matched yet (DNS/Cloudflare record may be pending)' ;;
            esac
            case \"\$ADMIN_CC\" in
              *no-cache*) echo '✅ Admin panel block live (assets are not edge-cached stale)' ;;
              *) echo '❌ admin.traceodd.com sent no Cache-Control - Cloudflare will edge-cache its assets (up to 4h) and hide the next deploy'; exit 1 ;;
            esac
            case \"\$SUBADMIN_LOC\" in
              */sub-admin/login*) echo '✅ Sub-Admin block live (root redirects to its login)' ;;
              *) echo '⚠️  subadmin.traceodd.com NOT matched yet (DNS/Cloudflare record may be pending)' ;;
            esac
          "

      # ──────────────────────────────────────────────────────────────
      # Post-Deployment: Fix permissions for all apps
      # ──────────────────────────────────────────────────────────────

      - name: Post-Deployment Permissions Fix
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            chown -R www-data:www-data /var/www/traceodd/frontend && \
            chmod -R 755 /var/www/traceodd/frontend && \
            chown -R www-data:www-data /var/www/traceodd/landing && \
            chmod -R 755 /var/www/traceodd/landing && \
            chown -R www-data:www-data /var/www/traceodd/cricket-public-web && \
            chmod -R 755 /var/www/traceodd/cricket-public-web && \
            chown -R www-data:www-data /var/www/traceodd/cricket-manager-web && \
            chmod -R 755 /var/www/traceodd/cricket-manager-web && \
            chown -R www-data:www-data /var/www/traceodd/reseller && \
            chmod -R 755 /var/www/traceodd/reseller && \
            chown -R www-data:www-data /var/www/traceodd/driver && \
            chmod -R 755 /var/www/traceodd/driver && \
