name: Deploy Flutter Web Frontend

on:
  push:
    branches:
      - mainnew
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "rust/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Flutter clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      # ──────────────────────────────────────────────────────────────
      # STEP A: Build & Deploy Admin Panel (main.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Admin Panel (main.dart)
        run: flutter build web --release

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 135.181.46.27 >> ~/.ssh/known_hosts

      - name: Deploy Admin Panel to /frontend/
        run: |
          rsync -avz --delete --progress build/web/ root@135.181.46.27:/var/www/traceodd/frontend/

      # ──────────────────────────────────────────────────────────────
      # STEP B: Build & Deploy Reseller App (main_reseller.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Reseller App (main_reseller.dart)
        run: flutter build web --release --target=lib/main_reseller.dart --base-href "/reseller/"

      - name: Deploy Reseller App to /reseller/
        run: |
          rsync -avz --delete --progress build/web/ root@135.181.46.27:/var/www/traceodd/reseller/

      # ──────────────────────────────────────────────────────────────
      # STEP C: Build & Deploy Driver App (main_driver.dart)
      # ──────────────────────────────────────────────────────────────

      - name: Build Driver App (main_driver.dart)
        run: flutter build web --release --target=lib/main_driver.dart --base-href "/driver/"

      - name: Deploy Driver App to /driver/
        run: |
          rsync -avz --delete --progress build/web/ root@135.181.46.27:/var/www/traceodd/driver/

      # ──────────────────────────────────────────────────────────────
      # Post-Deployment: Fix permissions for all apps
      # ──────────────────────────────────────────────────────────────

      - name: Post-Deployment Permissions Fix
        run: |
          ssh root@135.181.46.27 "
            chown -R www-data:www-data /var/www/traceodd/frontend && \
            chmod -R 755 /var/www/traceodd/frontend && \
            chown -R www-data:www-data /var/www/traceodd/reseller && \
            chmod -R 755 /var/www/traceodd/reseller && \
            chown -R www-data:www-data /var/www/traceodd/driver && \
            chmod -R 755 /var/www/traceodd/driver
          "
