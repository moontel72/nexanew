name: Media Engine — Deploy to VPS

# ============================================================================
# Deployment pipeline for the Rust media engine.
#
# Runs automatically AFTER "Media Engine — Build & Push Docker Image"
# succeeds (workflow_run), or manually via workflow_dispatch.
#
# On the VPS it:
#   1. Installs the docker-mode systemd units
#   2. Logs docker into GHCR and pulls the fresh images
#   3. Re-tags them to local names the units reference
#   4. Restarts todd-studio + todd-broadcaster
#   5. Health-checks the Studio API
#
# Required secrets:
#   SSH_KYE_HATZNER — SSH private key (historical name, keep exactly)
#   JWT_SECRET       — shared media-engine JWT secret
#   GHCR_USER        — GitHub username (same as the build workflow)
#   GHCR_TOKEN       — GitHub PAT with read:packages scope
#
# Required repository variables (Actions → Settings → Variables):
#   VPS_HOST
#   VPS_USER
#   JWT_ISSUER
#   MEDIA_PLANE
#   STUDIO_HOST
#   STUDIO_PORT
#   CRICKET_MANAGER_URL
#   CRICKET_MANAGER_MATCH_IDS
# ============================================================================

on:
  workflow_run:
    workflows: ["Media Engine — Build & Push Docker Image"]
    types: [completed]
    branches:
      - main
      - mainnew
  workflow_dispatch:
  # Allow a deploy-only change (e.g. fixing the deploy script or secret
  # wiring) to run without triggering a full image rebuild.
  push:
    branches:
      - main
      - mainnew
    paths:
      - ".github/workflows/media-engine-deploy.yml"

jobs:
  deploy:
    # Only deploy when the build actually succeeded (workflow_run fires on
    # failure too). Manual dispatches and deploy-only pushes always run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔥 SSH Setup (same pattern as the Flutter deploy workflows)
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          # Historical secret name has the "KYE" typo — keep it exactly.
          ssh-private-key: ${{ secrets.SSH_KYE_HATZNER }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "Host ${{ vars.VPS_HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config

      # ---------------------------------------------------------------- #
      # 1. Ship the docker-mode systemd units + prerequisites
      # ---------------------------------------------------------------- #
      - name: Install systemd units (docker mode)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "mkdir -p /opt/todd-media-engine"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
            media-engine/deploy/systemd/todd-studio.service \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/etc/systemd/system/todd-studio.service
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
            media-engine/deploy/systemd/todd-broadcaster.service \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/etc/systemd/system/todd-broadcaster.service

      - name: Install Docker on VPS (if missing)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "bash -s" <<'REMOTE'
            set -e
            if command -v docker >/dev/null 2>&1; then
              echo 'docker already installed'
              exit 0
            fi
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y ca-certificates curl gnupg lsb-release
            curl -fsSL https://get.docker.com | sh
            systemctl enable --now docker
            echo '✅ docker installed'
          REMOTE

      - name: Ensure media engine env file
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "bash -s" <<'REMOTE'
            set -e
            mkdir -p /opt/todd-media-engine
            printf 'JWT_SECRET=%s\n' '${{ secrets.JWT_SECRET }}' > /opt/todd-media-engine/.env
            [ -n '${{ vars.JWT_ISSUER }}' ] && printf 'JWT_ISSUER=%s\n' '${{ vars.JWT_ISSUER }}' >> /opt/todd-media-engine/.env
            [ -n '${{ vars.MEDIA_PLANE }}' ] && printf 'MEDIA_PLANE=%s\n' '${{ vars.MEDIA_PLANE }}' >> /opt/todd-media-engine/.env
            [ -n '${{ vars.STUDIO_HOST }}' ] && printf 'STUDIO_HOST=%s\n' '${{ vars.STUDIO_HOST }}' >> /opt/todd-media-engine/.env
            [ -n '${{ vars.STUDIO_PORT }}' ] && printf 'STUDIO_PORT=%s\n' '${{ vars.STUDIO_PORT }}' >> /opt/todd-media-engine/.env
            [ -n '${{ vars.CRICKET_MANAGER_URL }}' ] && printf 'CRICKET_MANAGER_URL=%s\n' '${{ vars.CRICKET_MANAGER_URL }}' >> /opt/todd-media-engine/.env
            [ -n '${{ vars.CRICKET_MANAGER_MATCH_IDS }}' ] && printf 'CRICKET_MANAGER_MATCH_IDS=%s\n' '${{ vars.CRICKET_MANAGER_MATCH_IDS }}' >> /opt/todd-media-engine/.env
            chmod 600 /opt/todd-media-engine/.env
            echo '✅ /opt/todd-media-engine/.env written'
          REMOTE

      # ---------------------------------------------------------------- #
      # 2. Pull images, re-tag locally, restart both services
      # ---------------------------------------------------------------- #
      - name: Pull images and restart services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "
            set -e
            echo '--- docker login ---'
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            echo '--- pull studio image ---'
            docker pull ghcr.io/${{ github.repository_owner }}/media-engine:latest
            docker tag ghcr.io/${{ github.repository_owner }}/media-engine:latest traceodd/media-engine:latest

            echo '--- pull broadcaster image ---'
            docker pull ghcr.io/${{ github.repository_owner }}/media-engine-broadcaster:latest
            docker tag ghcr.io/${{ github.repository_owner }}/media-engine-broadcaster:latest traceodd/media-engine-broadcaster:latest

            echo '--- restart services ---'
            systemctl daemon-reload
            systemctl restart todd-studio
            systemctl restart todd-broadcaster || echo 'broadcaster not enabled yet (Phase 1 embedded mode)'
            echo '✅ services restarted'
          "

      # ---------------------------------------------------------------- #
      # 3. Health check — retry for up to 30s while the container boots
      # ---------------------------------------------------------------- #
      - name: Verify deployment (healthz)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://localhost:8080/healthz; then
                echo '✅ healthz OK'
                exit 0
              fi
              echo \"healthz not ready yet (\$i/6), retrying in 5s...\"
              sleep 5
            done
            echo '❌ healthz failed after 30s'
            journalctl -u todd-studio --no-pager -n 50 || true
            exit 1
          "

      # ---------------------------------------------------------------- #
      # 4. Post-deploy status
      # ---------------------------------------------------------------- #
      - name: Deployment summary
        run: |
          echo "✅ Deployed to ${{ vars.VPS_HOST }}:"
          echo "   ghcr.io/${{ github.repository_owner }}/media-engine:latest -> todd-studio"
          echo "   ghcr.io/${{ github.repository_owner }}/media-engine-broadcaster:latest -> todd-broadcaster"
