name: Secret scan (working tree)

# Phase 0a of docs/handoff/PANEL-SEPARATION-PLAN.md §7b.5.
#
# Scans the WORKING TREE (`--no-git`), NOT git history. History still contains the
# credentials removed in this cycle, so a history scan would produce a red build that
# says nothing useful. Switch to history scanning once the passwords are rotated.
#
# ⚠️ `continue-on-error: true` IS DELIBERATE FOR THE FIRST RUNS.
#   The scan is new and cannot be validated locally before it runs here. Watch the first
#   run, confirm it reports 0 leaks, then set `continue-on-error` to `false` so it
#   becomes a real gate. Steps: docs/handoff/PHASE-0A-CREDENTIAL-REMEDIATION.md §5.

on:
  push:
    branches: [main, mainnew]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-tree:
    name: gitleaks (working tree, no history)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the config is missing
        run: |
          if [ ! -f .gitleaks.toml ]; then
            echo "ERROR: .gitleaks.toml is missing — the allowlist for the remediation docs is gone."
            exit 1
          fi

      - name: Run gitleaks against the working tree
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --no-git --source . --config .gitleaks.toml --redact --verbose
