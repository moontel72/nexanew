name: Tests

on:
  push:
    branches:
      # This repo deploys from `main` and `mainnew` (see AGENTS.md and
      # .github/workflows/deploy.yml). The previous values were `master` and
      # `*.x`, neither of which exists here, so push-triggered tests never ran
      # on the branches that actually deploy — only the nightly cron and
      # `pull_request` fired.
      - main
      - mainnew
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp backend/.env.example backend/.env

      - name: Generate app key
        run: cd backend && php artisan key:generate

      - name: Execute tests
        run: cd backend && php artisan test
