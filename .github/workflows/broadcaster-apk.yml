name: Todd Broadcaster APK — Build & Publish

# ============================================================================
# Builds the Todd Broadcaster Android APK (lib/main_broadcaster.dart) and
# publishes it to the download server:
#
#   https://traceodd.com/download/broadcaster/todd-broadcaster.apk
#
# Triggers:
#   - push to main/mainnew touching android/**, lib/** or pubspec files
#     (keeps the published APK in sync with app fixes automatically)
#   - manual workflow_dispatch (build on demand)
#
# The StoreKeeper app has its own workflow (android-build.yml) — this one
# is ONLY the ground-camera Broadcaster app.
# ============================================================================

on:
  push:
    branches:
      - main
      - mainnew
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/broadcaster-apk.yml"
  workflow_dispatch:

# One build at a time; a newer push supersedes a queued one.
concurrency:
  group: broadcaster-apk
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Brand the APK as Todd Broadcaster
        run: |
          sed -i 's/android:label="Trace Odd Store"/android:label="Todd Broadcaster"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      # --split-per-abi ships three small APKs instead of one ~100MB fat
      # APK; cameramen download only the one their phone needs. Icons are
      # tree-shaken (default) so the unused Material icon font is dropped.
      - name: Build Todd Broadcaster APKs (split per ABI)
        run: flutter build apk --release --split-per-abi -t lib/main_broadcaster.dart

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: todd-broadcaster-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7

      # ── Permanent download links ────────────────────────────────
      # The 64-bit ARM APK (every phone since ~2015) is the default
      # download; the 32-bit build covers very old devices and x86_64 is
      # for emulators. No GitHub account needed.
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KYE_HATZNER }}

      - name: Deploy APKs to download server
        run: |
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "mkdir -p /var/www/traceodd/download/broadcaster"
          scp -o StrictHostKeyChecking=no build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/download/broadcaster/todd-broadcaster.apk
          scp -o StrictHostKeyChecking=no build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/download/broadcaster/todd-broadcaster-32bit.apk
          scp -o StrictHostKeyChecking=no build/app/outputs/flutter-apk/app-x86_64-release.apk \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/download/broadcaster/todd-broadcaster-x86_64.apk
          ls -la /var/www/traceodd/download/broadcaster/
          echo "✅ Broadcaster APKs live at https://traceodd.com/download/broadcaster/"
