name: Deploy to Hetzner

on:
  push:
    branches:
      - main
      - mainnew
    paths:
      - "backend/**"
      - "lib/**"
      - "web/**"
      - "rust/**"
      - ".nginx/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install PHP dependencies (with Reverb)
        run: |
          cd backend
          composer require laravel/reverb --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary (CLI)
        timeout-minutes: 8
        run: |
          cd rust
          cargo build --release
          ls -la target/release/trace_odd_rust
          chmod +x target/release/trace_odd_rust

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KYE_HATZNER }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 135.181.46.27 >> ~/.ssh/known_hosts 2>/dev/null
          echo 'Host 135.181.46.27' >> ~/.ssh/config
          echo '  StrictHostKeyChecking no' >> ~/.ssh/config
          echo '  UserKnownHostsFile=/dev/null' >> ~/.ssh/config

      - name: Deploy backend via rsync
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --exclude='.env' --exclude='storage' --exclude='vendor' --exclude='bootstrap/cache' backend/ root@135.181.46.27:/var/www/traceodd/admin-panel/

      - name: Deploy Rust directory to server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" rust/ root@135.181.46.27:/var/www/traceodd/admin-panel/rust/

      - name: Deploy Rust shared libraries
        continue-on-error: true
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --include='*.so' --include='*.rlib' --exclude='*' rust/target/release/ root@135.181.46.27:/var/www/traceodd/rust-lib/ 2>/dev/null || echo "No shared libs to deploy"

      - name: Deploy Nginx configuration
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/traceodd.conf root@135.181.46.27:/etc/nginx/sites-available/traceodd
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            ln -sf /etc/nginx/sites-available/traceodd /etc/nginx/sites-enabled/traceodd
            rm -f /etc/nginx/sites-enabled/nexatrace 2>/dev/null || true
            nginx -t && systemctl reload nginx && echo 'Nginx OK'
          "

      - name: Deploy Reverb systemd unit
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/nexatrace-reverb.service root@135.181.46.27:/etc/systemd/system/nexatrace-reverb.service
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "systemctl daemon-reload && systemctl enable nexatrace-reverb"

      - name: Deploy Queue Worker systemd unit
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/nexatrace-queue.service root@135.181.46.27:/etc/systemd/system/nexatrace-queue.service
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "systemctl daemon-reload && systemctl enable nexatrace-queue"

      # --- CRICKET MODULE: Dual-Subdomain Infrastructure ---
      - name: Deploy Cricket Nginx server blocks (public + manager)
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/cricket-public.conf root@135.181.46.27:/etc/nginx/sites-available/cricket-public
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/cricket-manager.conf root@135.181.46.27:/etc/nginx/sites-available/cricket-manager
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            ln -sf /etc/nginx/sites-available/cricket-public /etc/nginx/sites-enabled/cricket-public
            ln -sf /etc/nginx/sites-available/cricket-manager /etc/nginx/sites-enabled/cricket-manager
            rm -f /etc/nginx/sites-enabled/cricket
            rm -f /etc/nginx/sites-available/cricket.disabled
            nginx -t && echo 'Cricket Nginx configs OK'
          "

      - name: Deploy Cricket SRS systemd unit
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/cricket-srs.service root@135.181.46.27:/etc/systemd/system/cricket-srs.service
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "systemctl daemon-reload"

      - name: Deploy Cricket SRS configuration
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "mkdir -p /usr/local/srs/conf"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/srs-cricket.conf root@135.181.46.27:/usr/local/srs/conf/cricket.conf

      - name: Deploy Cricket lifecycle scripts
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .scripts/cricket-sleep.sh root@135.181.46.27:/usr/local/bin/cricket-sleep.sh
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .scripts/cricket-wake.sh root@135.181.46.27:/usr/local/bin/cricket-wake.sh
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "chmod +x /usr/local/bin/cricket-sleep.sh /usr/local/bin/cricket-wake.sh"

      - name: Server Post-Deployment Tasks
        timeout-minutes: 10
        run: |
          ssh -o StrictHostKeyChecking=no root@135.181.46.27 "
            set -e
            cd /var/www/traceodd/admin-panel

            if [ -f rust/target/release/trace_odd_rust ]; then
              chmod +x rust/target/release/trace_odd_rust
              echo 'Rust binary OK: ' \$(rust/target/release/trace_odd_rust --version)
            else
              echo 'WARNING: Rust binary not found'
            fi
            chmod 755 /var/www/traceodd/rust-lib/*.so 2>/dev/null || true
            chown -R www-data:www-data /var/www/traceodd/rust-lib
            chown -R www-data:www-data /var/www/traceodd/admin-panel/rust

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            grep -q '^QUEUE_CONNECTION=' .env 2>/dev/null || echo 'QUEUE_CONNECTION=redis' >> .env
            grep -q '^CACHE_STORE=' .env 2>/dev/null || echo 'CACHE_STORE=redis' >> .env
            grep -q '^BROADCAST_DRIVER=' .env 2>/dev/null || echo 'BROADCAST_DRIVER=reverb' >> .env
            grep -q '^REVERB_APP_ID=' .env 2>/dev/null || echo 'REVERB_APP_ID=428540' >> .env
            grep -q '^REVERB_APP_KEY=' .env 2>/dev/null || echo 'REVERB_APP_KEY=nxbrv_app_key_nexa_2026' >> .env
            grep -q '^REVERB_APP_SECRET=' .env 2>/dev/null || echo 'REVERB_APP_SECRET=nxbrv_secret_hash_7x9k2m4p_nexa_2026' >> .env
            grep -q '^REVERB_HOST=' .env 2>/dev/null || echo 'REVERB_HOST=127.0.0.1' >> .env
            grep -q '^REVERB_PORT=' .env 2>/dev/null || echo 'REVERB_PORT=8080' >> .env
            grep -q '^REVERB_SCHEME=' .env 2>/dev/null || echo 'REVERB_SCHEME=http' >> .env
            grep -q '^REVERB_SERVER_HOST=' .env 2>/dev/null || echo 'REVERB_SERVER_HOST=0.0.0.0' >> .env
            grep -q '^REVERB_SERVER_PORT=' .env 2>/dev/null || echo 'REVERB_SERVER_PORT=8080' >> .env

            php artisan migrate --force
            php artisan db:seed --class=CricketFeatureRegistrySeeder --force
            php artisan optimize:clear
            php artisan optimize

            systemctl restart nexatrace-reverb || echo 'Reverb not yet installed'
            systemctl restart nexatrace-queue || echo 'Queue worker not yet installed'

            chown -R www-data:www-data /var/www/traceodd/admin-panel
            chown -R www-data:www-data /var/www/traceodd/frontend
            find /var/www/traceodd/admin-panel -type d -exec chmod 755 {} \;
            find /var/www/traceodd/admin-panel -type f -exec chmod 644 {} \;
            chmod -R 775 /var/www/traceodd/admin-panel/storage
            chmod -R 775 /var/www/traceodd/admin-panel/bootstrap/cache
            systemctl reload nginx
          "

      - name: Smoke test API for null/type regressions
        if: always()
        run: |
          echo "=== Cricket Teams API Smoke Test ==="
          python3 -c '
          import json, sys, urllib.request
          try:
              req = urllib.request.urlopen("http://135.181.46.27/api/v1/cricket/public/teams", timeout=15)
              data = json.loads(req.read().decode())
              teams = data.get("data", data) if isinstance(data, dict) else data
              if not isinstance(teams, list):
                  print("WARNING: Unexpected response structure")
                  sys.exit(0)
              issues = 0
              for t in teams:
                  if not isinstance(t, dict):
                      continue
                  for f in ["id", "name", "short_code"]:
                      if t.get(f) is None:
                          print("NULL FIELD: " + f + " in team " + str(t.get("name", "?")))
                          issues += 1
                  tid = t.get("id")
                  if tid is not None and not isinstance(tid, str):
                      print("TYPE ERROR: id is " + type(tid).__name__ + " in team " + str(t.get("name", "?")))
                      issues += 1
              if issues == 0:
                  print("OK: " + str(len(teams)) + " teams checked, 0 issues")
              else:
                  print("WARNING: " + str(issues) + " field issues detected")
          except Exception as e:
              print("Smoke test error (non-fatal): " + str(e))
          '
          echo "=== Smoke test done ==="
