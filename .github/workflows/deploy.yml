name: Deploy to Hetzner

on:
  push:
    branches:
      - main
      - mainnew
    paths:
      - "backend/**"
      - "lib/**"
      - "web/**"
      - "rust/**"
      - ".nginx/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install PHP dependencies (with Reverb)
        run: |
          cd backend
          composer require laravel/reverb --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binaries (CLI)
        timeout-minutes: 12
        run: |
          cd rust
          cargo build --release
          ls -la target/release/trace_odd_rust
          chmod +x target/release/trace_odd_rust

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KYE_HATZNER }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo 'Host ${{ vars.VPS_HOST }}' >> ~/.ssh/config
          echo '  StrictHostKeyChecking no' >> ~/.ssh/config
          echo '  UserKnownHostsFile=/dev/null' >> ~/.ssh/config

      - name: Deploy backend via rsync
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --exclude='.env' --exclude='storage' --exclude='vendor' --exclude='bootstrap/cache' backend/ ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/admin-panel/

      - name: Deploy Rust directory to server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" rust/ ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/admin-panel/rust/

      - name: Deploy Rust binaries to /opt/nexatrace
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "mkdir -p /opt/nexatrace /var/replays /var/www/traceodd/cricket-hls && chown -R www-data:www-data /var/replays"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" rust/target/release/trace_odd_rust ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/opt/nexatrace/trace_odd_rust
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "chmod +x /opt/nexatrace/trace_odd_rust && ln -sf /opt/nexatrace/trace_odd_rust /usr/local/bin/trace_odd_rust && echo 'Rust binaries installed'"

      - name: Deploy Rust shared libraries
        continue-on-error: true
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --include='*.so' --include='*.rlib' --exclude='*' rust/target/release/ ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/rust-lib/ 2>/dev/null || echo "No shared libs to deploy"

      - name: Deploy Nginx configuration
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/traceodd.conf ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/etc/nginx/sites-available/traceodd
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "
            ln -sf /etc/nginx/sites-available/traceodd /etc/nginx/sites-enabled/traceodd
            rm -f /etc/nginx/sites-enabled/nexatrace 2>/dev/null || true
            nginx -t && systemctl reload nginx && echo 'Nginx OK'
          "

      - name: Deploy Reverb systemd unit
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/nexatrace-reverb.service ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/etc/systemd/system/nexatrace-reverb.service
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "systemctl daemon-reload && systemctl enable nexatrace-reverb"

      - name: Deploy Queue Worker systemd unit
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/nexatrace-queue.service ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/etc/systemd/system/nexatrace-queue.service
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "systemctl daemon-reload && systemctl enable nexatrace-queue"

      # --- CRICKET MODULE: Dual-Subdomain Infrastructure ---
      - name: Deploy Cricket Nginx server blocks (public + manager)
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/cricket-public.conf ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/etc/nginx/sites-available/cricket-public
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/cricket-manager.conf ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/etc/nginx/sites-available/cricket-manager
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "
            ln -sf /etc/nginx/sites-available/cricket-public /etc/nginx/sites-enabled/cricket-public
            ln -sf /etc/nginx/sites-available/cricket-manager /etc/nginx/sites-enabled/cricket-manager
            rm -f /etc/nginx/sites-enabled/cricket
            rm -f /etc/nginx/sites-available/cricket.disabled
            nginx -t && systemctl reload nginx
            nginx -T 2>/dev/null | grep -q 'server_name cricket-manager.traceodd.com' && echo 'Cricket Nginx configs live'
          "

      - name: Deploy Cricket SRS systemd unit
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/cricket-srs.service ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/etc/systemd/system/cricket-srs.service
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "systemctl daemon-reload"

      - name: Deploy Cricket SRS configuration
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "mkdir -p /usr/local/srs/conf"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" .nginx/srs-cricket.conf ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/usr/local/srs/conf/cricket.conf

      - name: Server Post-Deployment Tasks
        timeout-minutes: 10
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "
            set -e
            cd /var/www/traceodd/admin-panel

            if [ -f rust/target/release/trace_odd_rust ]; then
              chmod +x rust/target/release/trace_odd_rust
              echo 'Rust binary OK: ' \$(rust/target/release/trace_odd_rust --version)
            else
              echo 'WARNING: Rust binary not found'
            fi
            chmod 755 /var/www/traceodd/rust-lib/*.so 2>/dev/null || true
            chown -R www-data:www-data /var/www/traceodd/rust-lib
            chown -R www-data:www-data /var/www/traceodd/admin-panel/rust

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            if [ -n '${{ vars.QUEUE_CONNECTION }}' ] && ! grep -q '^QUEUE_CONNECTION=' .env; then echo "QUEUE_CONNECTION=${{ vars.QUEUE_CONNECTION }}" >> .env; fi
            if [ -n '${{ vars.CACHE_STORE }}' ] && ! grep -q '^CACHE_STORE=' .env; then echo "CACHE_STORE=${{ vars.CACHE_STORE }}" >> .env; fi
            if [ -n '${{ vars.RUST_CHUNKER_URL }}' ] && ! grep -q '^RUST_CHUNKER_URL=' .env; then echo "RUST_CHUNKER_URL=${{ vars.RUST_CHUNKER_URL }}" >> .env; fi
            if [ -n '${{ vars.BROADCAST_DRIVER }}' ] && ! grep -q '^BROADCAST_DRIVER=' .env; then echo "BROADCAST_DRIVER=${{ vars.BROADCAST_DRIVER }}" >> .env; fi
            if [ -n '${{ vars.REVERB_APP_ID }}' ] && ! grep -q '^REVERB_APP_ID=' .env; then echo "REVERB_APP_ID=${{ vars.REVERB_APP_ID }}" >> .env; fi
            if [ -n '${{ secrets.REVERB_APP_KEY }}' ] && ! grep -q '^REVERB_APP_KEY=' .env; then echo "REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}" >> .env; fi
            if [ -n '${{ secrets.REVERB_APP_SECRET }}' ] && ! grep -q '^REVERB_APP_SECRET=' .env; then echo "REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}" >> .env; fi
            if [ -n '${{ vars.REVERB_HOST }}' ] && ! grep -q '^REVERB_HOST=' .env; then echo "REVERB_HOST=${{ vars.REVERB_HOST }}" >> .env; fi
            if [ -n '${{ vars.REVERB_PORT }}' ] && ! grep -q '^REVERB_PORT=' .env; then echo "REVERB_PORT=${{ vars.REVERB_PORT }}" >> .env; fi
            if [ -n '${{ vars.REVERB_SCHEME }}' ] && ! grep -q '^REVERB_SCHEME=' .env; then echo "REVERB_SCHEME=${{ vars.REVERB_SCHEME }}" >> .env; fi
            if [ -n '${{ vars.REVERB_SERVER_HOST }}' ] && ! grep -q '^REVERB_SERVER_HOST=' .env; then echo "REVERB_SERVER_HOST=${{ vars.REVERB_SERVER_HOST }}" >> .env; fi
            if [ -n '${{ vars.REVERB_SERVER_PORT }}' ] && ! grep -q '^REVERB_SERVER_PORT=' .env; then echo "REVERB_SERVER_PORT=${{ vars.REVERB_SERVER_PORT }}" >> .env; fi

            php artisan migrate --force
            php artisan db:seed --class=CricketFeatureRegistrySeeder --force
            php artisan optimize:clear
            php artisan optimize
            php artisan storage:link 2>/dev/null || true

            systemctl restart nexatrace-reverb || echo 'Reverb not yet installed'
            systemctl restart nexatrace-queue || echo 'Queue worker not yet installed'

            chown -R www-data:www-data /var/www/traceodd/admin-panel
            chown -R www-data:www-data /var/www/traceodd/frontend
            find /var/www/traceodd/admin-panel -type d -exec chmod 755 {} \;
            find /var/www/traceodd/admin-panel -type f -exec chmod 644 {} \;
            chmod -R 775 /var/www/traceodd/admin-panel/storage
            chmod -R 775 /var/www/traceodd/admin-panel/bootstrap/cache
            systemctl reload nginx
          "

      - name: Smoke test API for null/type regressions
        if: always()
        run: |
          echo "=== Cricket Teams API Smoke Test ==="
          python3 -c '
          import json, sys, urllib.request
          try:
              req = urllib.request.urlopen("http://${{ vars.VPS_HOST }}/api/v1/cricket/public/teams", timeout=15)
              data = json.loads(req.read().decode())
              teams = data.get("data", data) if isinstance(data, dict) else data
              if not isinstance(teams, list):
                  print("WARNING: Unexpected response structure")
                  sys.exit(0)
              issues = 0
              for t in teams:
                  if not isinstance(t, dict):
                      continue
                  for f in ["id", "name", "short_code"]:
                      if t.get(f) is None:
                          print("NULL FIELD: " + f + " in team " + str(t.get("name", "?")))
                          issues += 1
                  tid = t.get("id")
                  if tid is not None and not isinstance(tid, str):
                      print("TYPE ERROR: id is " + type(tid).__name__ + " in team " + str(t.get("name", "?")))
                      issues += 1
              if issues == 0:
                  print("OK: " + str(len(teams)) + " teams checked, 0 issues")
              else:
                  print("WARNING: " + str(issues) + " field issues detected")
          except Exception as e:
              print("Smoke test error (non-fatal): " + str(e))
          '
          echo "=== Smoke test done ==="
