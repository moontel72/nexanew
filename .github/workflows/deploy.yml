name: Deploy to Hetzner
on:
  push:
    branches: [ mainnew ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          
      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons
          
      - name: Deploy Flutter Web to Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 135.181.46.27
          username: root
          password: qUXXErRRghjE
          source: "build/web/*"
          target: "/var/www/nexatrace/admin-web/"
          strip_components: 2
          
      - name: Deploy Laravel Backend
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 135.181.46.27
          username: root
          password: qUXXErRRghjE
          source: "app/,bootstrap/,config/,database/,resources/,routes/,storage/,artisan,composer.json,composer.lock"
          target: "/var/www/nexatrace/admin-panel/"
          
      - name: Set Permissions
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 135.181.46.27
          username: root
          password: qUXXErRRghjE
          script: |
            cd /var/www/nexatrace/admin-panel
            chown -R www-data:www-data .
            chmod -R 755 storage bootstrap/cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache