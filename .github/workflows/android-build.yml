name: Build StoreKeeper APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: storekeeper-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  build-broadcaster-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Todd Broadcaster APK
        run: flutter build apk --release --no-tree-shake-icons -t lib/main_broadcaster.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todd-broadcaster-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # ── Permanent website download link ──────────────────────────
      # The APK is uploaded to the VPS so cameramen download it from
      # https://traceodd.com/download/broadcaster/todd-broadcaster.apk
      # (no GitHub account needed).
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KYE_HATZNER }}

      - name: Deploy APK to download server
        run: |
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=no ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "mkdir -p /var/www/traceodd/download/broadcaster"
          scp -o StrictHostKeyChecking=no build/app/outputs/flutter-apk/app-release.apk \
            ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/var/www/traceodd/download/broadcaster/todd-broadcaster.apk
          echo "✅ Broadcaster APK live at /download/broadcaster/todd-broadcaster.apk"
