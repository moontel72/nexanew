# gitleaks configuration — NexaTrace
#
# Companion to .github/workflows/secret-scan.yml and docs/handoff/START-HERE.md
# (Appendix A — the credential-remediation runbook).
#
# SCOPE: the scan runs against the WORKING TREE (`gitleaks detect --no-git`), not git
# history — per docs/handoff/MASTER-TASK-LIST.md §7b.5. Git history still contains
# credentials that were removed in this cycle; scanning history would fail the build on
# findings that are already deleted and pending rotation, which tells us nothing.
#
# ⚠️ RULES FOR FUTURE EDITORS
#   1. Never add a broad allowlist for `lib/**`, `backend/app/**`, `backend/routes/**`
#      or `assets/**`. Real, live credentials have been committed in those trees before.
#   2. Every allowlist entry must carry a comment saying WHY it exists and WHEN to remove it.

title = "NexaTrace"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# NO ALLOWLIST ENTRIES (2026-09-29).
#
# The two entries that used to live here pointed at the separation-plan and
# recommendations docs, which quoted the compromised password values as incident
# evidence. Those two files have been deleted and their material consolidated into
# docs/handoff/START-HERE.md + docs/handoff/MASTER-TASK-LIST.md, and both of those
# deliberately do NOT quote any credential value — so no allowlist entry is needed.
#
# Keep it that way: never re-introduce a value (or a broad path) here. If a genuine
# false positive ever appears, add a NARROW, commented entry naming the single file.
#
# Still owed (owner, server-side): rotate the leaked passwords — see START-HERE.md
# Appendix A. Once rotated, the working-tree scan can be switched to history scanning
# (with an allowlist entry for the historical commits + a rotation note), and then
# `continue-on-error: true` can be removed from the workflow.
# ---------------------------------------------------------------------------
