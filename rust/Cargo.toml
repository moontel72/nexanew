[package]
name = "trace_odd_rust"
version = "0.1.0"
edition = "2021"
authors = ["Trace Odd Team"]
description = "High-performance code generation module for Trace Odd System"
license = "MIT"
repository = "https://github.com/traceodd/trace-odd-system"
readme = "README.md"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "trace_odd_rust"

[[bin]]
name = "trace_odd_rust"
path = "src/main.rs"

[dependencies]
rand = "0.8.5"
uuid = { version = "1.6.0", features = ["v4", "serde"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
chrono = { version = "0.4.31", features = ["serde"] }
hex = "0.4.3"

# Video chunking (binary: video-chunker)
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
sha2 = "0.10.7"
aes = "0.8.3"
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
hmac = "0.12.1"
base64 = "0.21.5"
# qr-code, barcode, gs1 removed — crates not available on crates.io
regex = "1.10.2"
thiserror = "1.0.50"
log = "0.4.20"
env_logger = "0.10.0"
rayon = "1.8.0"
crossbeam = "0.8.2"
lazy_static = "1.4.0"
parking_lot = "0.12.1"

# Flutter integration
flutter_rust_bridge = "1.82.4"
flutter_rust_bridge_codegen = { version = "1.82.4", optional = true }

[build-dependencies]
flutter_rust_bridge_codegen = "1.82.4"
chrono = { version = "0.4.31", features = ["serde"] }

[dev-dependencies]
criterion = "0.5.1"
tempfile = "3.8.0"

[features]
default = []
ffi = []
wasm = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
