<!doctype html>
<html>
    <head>
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />

        <!--
          NOTE: this file is copied over build/web/index.html by the marketplace
          deploy step ONLY (frontend-deploy.yml STEP H2). The shared web/index.html
          has no viewport meta, so Flutter's loader injects its own --
          `maximum-scale=1.0, user-scalable=no` -- which is why the public site
          could not be pinch-zoomed on a phone. Declaring it here, before the
          loader runs, wins: the loader only adds a meta when none exists.
        -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes"
        />

        <meta
            name="description"
            content="Trace Odd Marketplace — wholesale from verified factories. Browse every published product with its wholesale price and MOQ. No login required."
        />
        <meta name="theme-color" content="#4F46E5" />

        <!-- iOS meta tags & icons -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Trace Odd Market" />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>Trace Odd Marketplace — Wholesale from Verified Factories</title>
        <link rel="manifest" href="manifest.json" />
    </head>
    <body>
        <script src="flutter_bootstrap.js?v=1.0.3" async></script>
    </body>
</html>
