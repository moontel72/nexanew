<!doctype html>
<html>
    <head>
        <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
        <meta
            name="description"
            content="Trace Odd — live sports broadcasting, fleet, factory and commerce operations on one platform."
        />
        <meta name="theme-color" content="#0A0E21" />

        <!-- iOS meta tags & icons -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Trace Odd" />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>Trace Odd</title>
        <link rel="manifest" href="manifest.json" />

        <!-- PWA: register the minimal service worker (network-first) so the
             site is installable and gets an offline shell. The version query
             is bumped on every deploy so browsers pick up SW changes. -->
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", function () {
                    navigator.serviceWorker
                        .register("sw.js?v=1")
                        .catch(function (err) {
                            console.warn("SW registration skipped:", err);
                        });
                });
            }
        </script>
    </head>
    <body>
        <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
        <script src="flutter_bootstrap.js?v=1.0.3" async></script>
    </body>
</html>
