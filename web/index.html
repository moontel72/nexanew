<!doctype html>
<html>
    <head>
        <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />

        <!-- PHONES MUST BE ABLE TO PINCH-ZOOM (owner, 2026-09-29).

             The template used to declare no viewport at all, so Flutter's web engine
             injected its own restrictive one (`width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no`) — text stays tiny and pinching does
             nothing. Declaring ours here is NOT enough on its own: the engine can
             replace it again while the app boots, which is why an earlier "fix"
             looked correct in the file yet the site still would not zoom.

             So: declare it, and keep re-asserting it (see the script below). -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes"
        />
        <meta
            name="description"
            content="Trace Odd — live sports broadcasting, fleet, factory and commerce operations on one platform."
        />
        <meta name="theme-color" content="#0A0E21" />

        <!-- iOS meta tags & icons -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Trace Odd" />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>Trace Odd</title>
        <link rel="manifest" href="manifest.json" />

        <!-- SECOND, EASIER-TO-MISS CAUSE of "pinch-zoom does nothing" (owner, 2026-09-30).

             Even with a permissive viewport, Flutter's web engine sets
             `touch-action: none` on its canvas/glass pane so IT owns every gesture —
             the browser is then not allowed to zoom, no matter what the meta tag
             says. That is why the viewport-only fix could look correct and still
             change nothing on a phone.

             `pinch-zoom` (NOT `pan-x pan-y`) is the surgical value: the browser may
             only handle the two-finger pinch, while single-finger pan/drag still
             goes to Flutter, so in-app scrolling keeps working.
             `!important` is needed because the engine writes its value inline. -->
        <style>
            html,
            body,
            flutter-view,
            flt-glass-pane,
            flt-scene-host {
                touch-action: pinch-zoom !important;
            }

            /* Never let an uncovered strip show as WHITE. If a browser still pans
               past the app (see the visualViewport shim below), paint the page the
               way the app paints itself instead of the browser's white default. */
            html,
            body {
                background-color: #0a0e21;
            }
        </style>

        <!-- THIRD cause of "zoomed, but a WHITE band appears on the right/bottom"
             (owner, 2026-09-30). This one is NOT about the gesture being blocked —
             zoom already worked; the page just slid off and left a growing white gap.

             What happens: when the phone is zoomed, Flutter's web engine reads
             `window.visualViewport` and treats the ZOOMED (smaller) view as "the
             window shrank", so it re-lays the app out to `screen / zoom` CSS pixels
             and shrinks its canvas to match, anchored top-left. The browser still
             lets you pan across the full LAYOUT viewport, so everything right of and
             below that shrunken canvas is empty. That is the white band, and it grows
             with zoom (2x zoom leaves about half the screen white — exactly what the
             owner's screenshots show).

             The fix: stop the engine from mistaking zoom for a resize. Report the
             LAYOUT viewport (which zoom does not change) as the view size, while
             leaving `scale` real so the engine still renders at full resolution
             (sharp when magnified, not blurry). The app then keeps filling the screen
             and the browser magnifies it normally — no uncovered area to pan into. -->
        <script>
            (function () {
                var real = window.visualViewport;
                // No visualViewport (or no zoom support): nothing to correct.
                if (!real || !real.scale) return;

                function layoutSize(prop, fallback) {
                    var el = document.documentElement;
                    var v = el ? el[prop] : 0;
                    return v || window[fallback];
                }

                var shim = {
                    // The REAL zoom factor, so the engine's render resolution stays
                    // correct (this is what makes zoomed text sharp).
                    get scale() {
                        return real.scale;
                    },
                    // The layout viewport in CSS px — deliberately independent of
                    // zoom, so the engine does not shrink the app when pinching.
                    get width() {
                        return layoutSize("clientWidth", "innerWidth");
                    },
                    get height() {
                        return layoutSize("clientHeight", "innerHeight");
                    },
                    get offsetLeft() {
                        return real.offsetLeft;
                    },
                    get offsetTop() {
                        return real.offsetTop;
                    },
                    // Flutter subscribes to "resize" here; keep forwarding it so it
                    // still updates its device-pixel ratio (crispness) on zoom.
                    addEventListener: function () {
                        return real.addEventListener.apply(real, arguments);
                    },
                    removeEventListener: function () {
                        return real.removeEventListener.apply(real, arguments);
                    },
                };

                try {
                    Object.defineProperty(window, "visualViewport", {
                        configurable: true,
                        get: function () {
                            return shim;
                        },
                    });
                } catch (e) {
                    /* locked-down property: fall back to the real one */
                }
            })();
        </script>

        <!-- Keep the zoomable viewport above (see the comment there).

             Flutter's engine may set its own restrictive viewport at runtime; this
             re-asserts ours whenever that happens, so pinch-zoom and pan keep working
             on phones for every app built from this template (landing, admin, cricket,
             marketplace, ...). It only writes when the value actually differs, so it
             cannot loop. -->
        <script>
            (function () {
                var WANT =
                    "width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes";
                function fixViewport() {
                    var meta = document.querySelector('meta[name="viewport"]');
                    if (!meta) {
                        meta = document.createElement("meta");
                        meta.setAttribute("name", "viewport");
                        document.head.appendChild(meta);
                    }
                    if (meta.getAttribute("content") !== WANT) {
                        meta.setAttribute("content", WANT);
                    }
                }
                fixViewport();
                document.addEventListener("DOMContentLoaded", fixViewport);
                window.addEventListener("load", fixViewport);
                try {
                    new MutationObserver(fixViewport).observe(document.documentElement, {
                        childList: true,
                        subtree: true,
                        attributes: true,
                        attributeFilter: ["content"],
                    });
                } catch (e) {
                    /* very old browser: the static meta above still applies */
                }
            })();
        </script>

        <!-- PWA: register the minimal service worker (network-first) so the
             site is installable and gets an offline shell. The version query
             is bumped on every deploy so browsers pick up SW changes. -->
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", function () {
                    navigator.serviceWorker
                        .register("sw.js?v=1")
                        .catch(function (err) {
                            console.warn("SW registration skipped:", err);
                        });
                });
            }
        </script>
    </head>
    <body>
        <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
        <script src="flutter_bootstrap.js?v=1.0.3" async></script>
    </body>
</html>
